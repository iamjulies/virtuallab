<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChemLab Studio — virlab_beta_v4+build.20</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="device-frame-wrap" class="device-frame-wrap" data-device="auto">
    <div class="app-shell">
      <!-- Top Environment & Controls Bar -->
      <header id="env-bar"></header>

      <!-- Multi-Bench Workspace Tab Strip (1..10 active labs + cross-bench drag transfer) -->
      <nav id="lab-tabs-bar" class="lab-tabs-bar"></nav>

      <!-- Mobile Tab Navigation -->
      <nav class="mobile-tabs-bar">
        <button type="button" class="mobile-tab-btn" data-tab="shelf"></button>
        <button type="button" class="mobile-tab-btn" data-tab="bench"></button>
        <button type="button" class="mobile-tab-btn" data-tab="inspector"></button>
      </nav>

      <!-- Main 3-Column Workbench -->
      <main class="workspace-grid">
        <!-- Left Panel: Apparatus & Pure Reagents Shelf -->
        <aside id="panel-shelf" class="panel-card">
          <div id="shelf-panel" class="h-full overflow-y-auto"></div>
        </aside>

        <!-- Center Panel: Interactive Physics/Chemistry Canvas Bench -->
        <section id="panel-bench" class="panel-card workbench-panel active-mobile-tab gap-2">
          <div id="bench-top-toolbar" class="flex items-center justify-between gap-2 px-1">
            <span id="bench-hint-text" class="text-xs text-muted truncate"></span>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" id="btn-compare-mode" class="px-2.5 py-1 rounded-lg border border-theme bg-surface-alt text-xs font-medium hover:border-accent shrink-0 transition"></button>
              <button type="button" id="btn-reset-bench" class="px-2.5 py-1 rounded-lg border border-theme bg-surface-alt text-xs font-medium hover:border-accent shrink-0 transition"></button>
            </div>
          </div>
          <div class="workbench-canvas-wrap">
            <canvas id="workbench-canvas" class="workbench-canvas"></canvas>
            <div id="storage-locker-root" class="storage-locker-root hidden"></div>
            <div id="canvas-zoom-hud" class="canvas-zoom-hud">
              <div id="canvas-zoom-controls" class="canvas-zoom-controls hidden">
                <button type="button" id="btn-zoom-out" class="canvas-zoom-btn" title="Zoom Out">−</button>
                <span id="zoom-level-badge" class="canvas-zoom-badge">1.0×</span>
                <button type="button" id="btn-zoom-in" class="canvas-zoom-btn" title="Zoom In">+</button>
                <button type="button" id="btn-zoom-reset" class="canvas-zoom-btn" title="Reset 1×">1×</button>
              </div>
              <button type="button" id="btn-zoom-loupe" class="canvas-zoom-btn" title="Magnifier Loupe">🔍</button>
            </div>
            <div id="bench-pick-banner" class="bench-pick-banner hidden">
              <span id="bench-pick-text"></span>
              <button type="button" id="bench-pick-cancel" class="px-2.5 py-1 rounded-lg border border-theme bg-surface-alt text-xs font-medium hover:border-accent shrink-0 whitespace-nowrap"></button>
            </div>
          </div>
          <div id="comparison-panel-root" class="comparison-panel hidden"></div>
        </section>

        <!-- Right Panel: Real-Time Telemetry, Species & Reaction Inspector -->
        <aside id="panel-inspector" class="panel-card">
          <div id="inspector-panel" class="h-full overflow-y-auto pr-1"></div>
        </aside>
      </main>
    </div>
  </div>

  <!-- Precision Dosing & Pouring Modal -->
  <div id="dosing-modal-root" class="hidden"></div>

  <!-- Toast Alert Banner -->
  <div id="toast-banner" class="toast-banner hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
