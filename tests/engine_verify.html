    // TEST 115: NaCl Starter Reagent, Thermodynamics (801 °C mp, 1465 °C bp, Conductive Melt), Diaphragm vs Javelle Brine Electrolysis & Solvay Process
    {
      const naclReg = STARTER_REAGENTS.find((r) => r.id === 'nacl');
      const spNaCl = SPECIES.NaCl_s;
      const thermoOk =
        Boolean(naclReg && naclReg.speciesId === 'NaCl_s') &&
        Math.abs(spNaCl.meltTempK - 1074.15) < 0.5 &&
        Math.abs(spNaCl.boilTempK - 1738.15) < 0.5 &&
        spNaCl.noDecomp === true &&
        !spNaCl.decompTempK &&
        spNaCl.conductiveMelt === true;

      // 1) Solid NaCl (700 K) non-conductive vs Molten NaCl (1120 K >= 801 C) conductive electrolysis -> Na + Cl2(g)
      const simMelt = new LabSimulation();
      simMelt.environment.atmosphereMode = 'inert';
      const cruc = simMelt.createApparatus('crucible_porcelain', 300, 427);
      cruc.moles = { NaCl_s: 0.4 };
      cruc.tempK = 700.0;
      const elM1 = simMelt.createApparatus('electrode_rod', 288, 395);
      elM1.material = 'C';
      elM1.dockedVesselId = cruc.id;
      const elM2 = simMelt.createApparatus('electrode_rod', 312, 395);
      elM2.material = 'C';
      elM2.dockedVesselId = cruc.id;
      const dcM = simMelt.createApparatus('dc_power', 500, 420);
      dcM.posElectrodeId = elM1.id;
      dcM.negElectrodeId = elM2.id;
      simMelt.setDcPowerState(dcM.id, { voltageV: 8.0, powerOn: true });
      simMelt.step(0.05);
      const solidCurrentA = dcM.measuredCurrentA;
      cruc.tempK = 1120.0;
      for (let i = 0; i < 40; i++) {
        cruc.tempK = 1120.0;
        simMelt.step(0.1);
      }
      const moltenCurrentA = dcM.measuredCurrentA;
      const moltenMadeNaAndCl2 = (cruc.moles.Na_s || 0) > 5e-5 && (cruc.escapedGasMoles?.Cl2_g || 0) > 2e-5;

      // 2) Two-vessel Diaphragm/Salt-Bridge Brine Electrolysis -> pure NaOH(aq) + H2 at Cathode, Cl2 at Anode, zero ClO-
      const simDiaph = new LabSimulation();
      const bAn = simDiaph.createApparatus('beaker_250', 220, 427);
      bAn.moles = { H2O_l: 6.0, Na_aq: 0.6, Cl_aq: 0.6 };
      const bCath = simDiaph.createApparatus('beaker_250', 320, 427);
      bCath.moles = { H2O_l: 6.0, Na_aq: 0.3, Cl_aq: 0.3 };
      const sbD = simDiaph.createApparatus('salt_bridge', 270, 390);
      const elPosD = simDiaph.createApparatus('electrode_rod', 210, 410);
      elPosD.material = 'C';
      elPosD.dockedVesselId = bAn.id;
      const elNegD = simDiaph.createApparatus('electrode_rod', 330, 410);
      elNegD.material = 'C';
      elNegD.dockedVesselId = bCath.id;
      simDiaph.updateSupportAttachments();
      const dcD = simDiaph.createApparatus('dc_power', 520, 420);
      dcD.posElectrodeId = elPosD.id;
      dcD.negElectrodeId = elNegD.id;
      simDiaph.setDcPowerState(dcD.id, { voltageV: 8.0, powerOn: true });
      stepSeconds(simDiaph, 15.0, 0.1);
      const diaphOk =
        (bAn.escapedGasMoles?.Cl2_g || 0) > 5e-5 &&
        (bCath.escapedGasMoles?.H2_g || 0) > 5e-5 &&
        (bCath.moles.OH_aq || 0) > 1e-4 &&
        (bCath.moles.ClO_aq || 0) === 0 &&
        (bAn.moles.ClO_aq || 0) === 0;

      // 3) Single-vessel Brine Electrolysis (no diaphragm) -> forms Javelle ClO-(aq)
      const simJav = new LabSimulation();
      const bJav = simJav.createApparatus('beaker_250', 260, 427);
      bJav.moles = { H2O_l: 6.0, Na_aq: 0.6, Cl_aq: 0.6 };
      const elPJ = simJav.createApparatus('electrode_rod', 245, 410);
      elPJ.material = 'C';
      elPJ.dockedVesselId = bJav.id;
      const elNJ = simJav.createApparatus('electrode_rod', 275, 410);
      elNJ.material = 'C';
      elNJ.dockedVesselId = bJav.id;
      simJav.updateSupportAttachments();
      const dcJ = simJav.createApparatus('dc_power', 480, 420);
      dcJ.posElectrodeId = elPJ.id;
      dcJ.negElectrodeId = elNJ.id;
      simJav.setDcPowerState(dcJ.id, { voltageV: 8.0, powerOn: true });
      stepSeconds(simJav, 15.0, 0.1);
      const javelClO = bJav.moles.ClO_aq || 0;

      // 4) Solvay Process: Saturated NaCl + NH3 + CO2 -> NaHCO3(s) precipitate + NH4Cl(aq); then thermal calcination -> Na2CO3(s)
      const simSolv = new LabSimulation();
      const bSolv = simSolv.createApparatus('beaker_250', 300, 427);
      bSolv.moles = { H2O_l: 2.8, Na_aq: 0.30, Cl_aq: 0.30, NH3_aq: 0.14, H2CO3_aq: 0.14 };
      stepSeconds(simSolv, 3.0, 0.05);
      const nahco3Ppt = bSolv.moles.NaHCO3_s || 0;
      const nh4Formed = bSolv.moles.NH4_aq || 0;

      const crucRoast = simSolv.createApparatus('crucible_porcelain', 480, 427);
      crucRoast.moles = { NaHCO3_s: nahco3Ppt };
      crucRoast.tempK = 460.0;
      stepSeconds(simSolv, 5.0, 0.05);
      const na2co3Yield = crucRoast.moles.Na2CO3_s || 0;

      assert(
        'NaCl reagent & thermodynamics (801 °C mp conductive melt, 1465 °C bp, no decomp), diaphragm vs Javelle brine electrolysis & Solvay NaHCO3->Na2CO3 pass',
        thermoOk &&
          solidCurrentA === 0 &&
          moltenCurrentA > 0.3 &&
          moltenMadeNaAndCl2 &&
          diaphOk &&
          javelClO > 5e-5 &&
          nahco3Ppt > 0.015 &&
          nh4Formed > 0.08 &&
          na2co3Yield > 0.004,
        `thermo=${thermoOk}, I_solid=${solidCurrentA}, I_melt=${moltenCurrentA.toFixed(2)}A, diaph=${diaphOk}, ClO=${(javelClO*1000).toFixed(2)}mmol, NaHCO3=${(nahco3Ppt*1000).toFixed(1)}mmol, Na2CO3=${(na2co3Yield*1000).toFixed(1)}mmol`
      );
    }

    // TEST 116: Universal 4-Step (H+ + NO3-) Metal Filter & Electron-Conservation Auto-Balancer (Zn, Fe, Cu, HCl+NaNO3, 2NO+O2->2NO2)
    {

      bZnMed.moles.Zn_s = 0.03;

      const bZnVeryDil = simOx.createApparatus('beaker_250', 420, 427);

      simOx.addReagentToVessel(bZnVeryDil.id, 'hno3_68', 5, { silentAnim: true, silentEmit: true });
      bZnVeryDil.moles.Zn_s = 0.03;

      // 4) Mixed HCl + NaNO3 (no HNO3 reagent!) + Cu(s) & Zn(s) -> oxidizes via (H+ + NO3-) with ZERO H2(g)
      const bMixCu = simOx.createApparatus('beaker_250', 560, 427);
      bMixCu.moles = { H2O_l: 3.0, H_aq: 0.12, Cl_aq: 0.12, Na_aq: 0.12, NO3_aq: 0.12, Cu_s: 0.025 };
      const bMixZn = simOx.createApparatus('beaker_250', 700, 427);
      bMixZn.moles = { H2O_l: 3.0, H_aq: 0.12, Cl_aq: 0.12, Na_aq: 0.12, NO3_aq: 0.12, Zn_s: 0.025 };

      // 5) Sealed flask with NO(g) + O2(g) -> spontaneous 2NO + O2 -> 2NO2
      const fNoOx = simOx.createApparatus('erlenmeyer_250', 840, 405);
      fNoOx.isStoppered = true;
      fNoOx.stopperMode = 'solid';
      fNoOx.headspaceGasMoles.NO_g = 0.004;
      fNoOx.headspaceGasMoles.O2_g = 0.003;

      stepSeconds(simOx, 4.0, 0.05);

      const zeroH2Everywhere =
        (bZnConc.escapedGasMoles?.H2_g || 0) === 0 &&
        (bZnMed.escapedGasMoles?.H2_g || 0) === 0 &&
        (bZnVeryDil.escapedGasMoles?.H2_g || 0) === 0 &&
        (bMixCu.escapedGasMoles?.H2_g || 0) === 0 &&
        (bMixZn.escapedGasMoles?.H2_g || 0) === 0;
      const znConcOk = (bZnConc.escapedGasMoles?.NO2_g || 0) > 0.001;
      const znMedOk =
        (bZnMed.escapedGasMoles?.NO_g || 0) > 1e-4 &&
        (bZnMed.escapedGasMoles?.N2O_g || 0) > 1e-4 &&
        (bZnMed.escapedGasMoles?.N2_g || 0) > 2e-5;
      const znVeryDilOk = (bZnVeryDil.moles.NH4_aq || 0) > 5e-5 && (bZnVeryDil.escapedGasMoles?.NO2_g || 0) === 0;
      const mixCuOk = (bMixCu.moles.Cu2_aq || 0) > 1e-4 && (bMixCu.escapedGasMoles?.NO_g || 0) > 5e-5;
      const mixZnOk = (bMixZn.moles.Zn2_aq || 0) > 5e-4;
      const noOxOk = (fNoOx.headspaceGasMoles.NO2_g || 0) > 0.002 && (fNoOx.headspaceGasMoles.NO_g || 0) < 0.002;

      // Verify exact mathematical balance of solveMetalNitrateStep for Zn (n=2) -> N2O (ep=8, kN=2, hP=10): 4Zn + 10H+ + 2NO3- -> 4Zn2+ + N2O + 5H2O
      const stN2O = solveMetalNitrateStep(0.4, 2, 10.0, 10.0, NITRATE_PRODUCTS.N2O);
      const mathExact =
        Math.abs(stN2O.deltaMetalIon - 0.4) < 1e-12 &&
        Math.abs(stN2O.deltaHPlus - (-1.0)) < 1e-12 &&
        Math.abs(stN2O.deltaNO3Minus - (-0.2)) < 1e-12 &&
        Math.abs(stN2O.deltaProduct - 0.1) < 1e-12 &&
        Math.abs(stN2O.deltaH2O - 0.5) < 1e-12;

      assert(
        '4-Step (H+ + NO3-) Metal Redox Solver blocks H2 completely, yields NO2 / NO+N2O+N2 / NH4+ by E0×[HNO3], handles HCl+NaNO3, and oxidizes 2NO+O2->2NO2',
        zeroH2Everywhere && znConcOk && znMedOk && znVeryDilOk && mixCuOk && mixZnOk && noOxOk && mathExact,
        `zeroH2=${zeroH2Everywhere}, znNO2=${(bZnConc.escapedGasMoles?.NO2_g||0).toFixed(4)}, znN2O=${(bZnMed.escapedGasMoles?.N2O_g||0).toFixed(4)}, znNH4=${(bZnVeryDil.moles.NH4_aq||0).toFixed(5)}, mixCu=${(bMixCu.moles.Cu2_aq||0).toFixed(4)}, no2Head=${(fNoOx.headspaceGasMoles.NO2_g||0).toFixed(4)}, math=${mathExact}`
      );
    }

    {

      simBa.addReagentToVessel(bBa.id, 'h2o', 40, { silentAnim: true, silentEmit: true });

      simBa.setBurnerFlame(burner.id, 3);

    {

      assert(

    // TEST 155: Prompt 37 (beta_v4+build.3) — K vs Na (auto-ignition & air tarnish), Mg vs Zn (faster acid, non-amphoteric, brightWhiteFlash), Al vs Fe (cold conc H2SO4/HNO3 passivation + Al(OH)3 white gel)
    {
      const simK = new LabSimulation();
      // 1. K+H2O self-ignites H2 immediately & beats Na rate + dry air K tarnish
      const bNaW = simK.createApparatus('beaker_250', 150, 427);

      simK.addReagentToVessel(bKW2.id, 'h2o', 80.0, { silentAnim: true, silentEmit: true });
      simK.addReagentToVessel(bKW2.id, 'k', 0.39, { silentAnim: true, silentEmit: true }); // 0.01 mol
      const bKDry = simK.createApparatus('beaker_250', 490, 427);

      stepSeconds(simK, 1.5, 0.05);
      const kFasterNaOk = (bKW2.moles.OH_aq || 0) > (bNaW.moles.OH_aq || 0) && (bKDry.kTarnishFrac || 0) > 0.25 && SPECIES.K_s.meltTempK < SPECIES.Na_s.meltTempK && SPECIES.K_s.density < 0.9;

      // 2. Mg dissolves faster than Zn in dilute HCl, burns with mgCombustionTimer, and Mg(OH)2 does NOT dissolve in excess NaOH
      const simMA = new LabSimulation();
      const bZnA = simMA.createApparatus('beaker_250', 150, 427);
      simMA.addReagentToVessel(bZnA.id, 'h2o', 20.0, { silentAnim: true, silentEmit: true });
      simMA.addReagentToVessel(bZnA.id, 'hcl_37', 10.0, { silentAnim: true, silentEmit: true });
      simMA.addReagentToVessel(bZnA.id, 'zn', 0.65, { silentAnim: true, silentEmit: true });
      const bMgA = simMA.createApparatus('beaker_250', 320, 427);
      simMA.addReagentToVessel(bMgA.id, 'h2o', 20.0, { silentAnim: true, silentEmit: true });
      simMA.addReagentToVessel(bMgA.id, 'hcl_37', 10.0, { silentAnim: true, silentEmit: true });
      simMA.addReagentToVessel(bMgA.id, 'mg', 0.243, { silentAnim: true, silentEmit: true });
      const bMgBase = simMA.createApparatus('beaker_250', 490, 427);
      bMgBase.moles = { H2O_l: 2.0, MgOH2_s: 0.02, Na_aq: 0.4, OH_aq: 0.4 };
      const bMgBurn = simMA.createApparatus('crucible_porcelain', 650, 427);
      bMgBurn.moles = { Mg_s: 0.02 };
      bMgBurn.tempK = 950.0;
      const bAlH2SO4 = simMA.createApparatus('beaker_250', 810, 427);
      simMA.addReagentToVessel(bAlH2SO4.id, 'h2so4_98', 25.0, { silentAnim: true, silentEmit: true });
      simMA.addReagentToVessel(bAlH2SO4.id, 'al', 0.54, { silentAnim: true, silentEmit: true });
      const alStart = bAlH2SO4.moles.Al_s || 0;
      stepSeconds(simMA, 1.5, 0.05);
      const mgFasterZnOk = (bMgA.moles.Mg2_aq || 0) > (bZnA.moles.Zn2_aq || 0);
      const mgNonAmphOk = Math.abs((bMgBase.moles.MgOH2_s || 0) - 0.02) < 1e-6;
      const mgFlashOk = (bMgBurn.mgCombustionTimer || 0) > 0.1 && (bMgBurn.moles.MgO_s || 0) > 1e-3;
      const alConcH2SO4PassOk = bAlH2SO4.alPassivated === true && Math.abs((bAlH2SO4.moles.Al_s || 0) - alStart) < 1e-5;
      const alGelVisualOk = SPECIES.AlOH3_s.visualType === 'gel_precipitate' && SPECIES.Al_s.density === 2.70;

        'Prompt 37 metal parity (K vs Na, Mg vs Zn, Al vs Fe): K instant H2 lilac ignite & air tarnish, Mg>Zn rate & non-amphoteric Mg(OH)2 & flash, Al cold H2SO4 98% passivation & gel Al(OH)3',
        kInstantIgniteOk && kFasterNaOk && mgFasterZnOk && mgNonAmphOk && mgFlashOk && alConcH2SO4PassOk && alGelVisualOk,
        `kIgn=${kInstantIgniteOk}(${kIgnInfo}), kFast=${kFasterNaOk}(K_OH=${(bKW2.moles.OH_aq||0).toFixed(4)},Na_OH=${(bNaW.moles.OH_aq||0).toFixed(4)},kTarn=${(bKDry.kTarnishFrac||0).toFixed(2)}), mgFast=${mgFasterZnOk}(Mg2=${(bMgA.moles.Mg2_aq||0).toFixed(4)},Zn2=${(bZnA.moles.Zn2_aq||0).toFixed(4)}), mgNoAmph=${mgNonAmphOk}, mgFlash=${mgFlashOk}(timer=${(bMgBurn.mgCombustionTimer||0).toFixed(2)}), alSulfatePass=${alConcH2SO4PassOk}, alGel=${alGelVisualOk}`
      );

    // TEST 156: H2SO4 dilute (via h2so4_98 + h2o) vs H2SO4 conc:
    // 1) Dilute H2SO4: 2 H+ eq, ZERO ambient acid fuming, BaSO4 ppt with BaCl2, CaSO4 crust slows coarse CaCO3 vs HCl
    // 2) Boiling down dilute H2SO4 >78% regenerates molecular H2SO4_l -> releases HCl from NaCl & zero NO2 leak; >=300C evolves SO3 mist
    {
      const simS = new LabSimulation();
      // A. Non-volatile ambient check + BaSO4 + coarse CaCO3 slowdown vs HCl
      const bDil = simS.createApparatus('beaker_250', 140, 427);
      simS.addReagentToVessel(bDil.id, 'h2o', 13.5, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bDil.id, 'h2so4_98', 1.65, { silentAnim: true, silentEmit: true });
      bDil.tempK = 298.15;
      const bBa = simS.createApparatus('beaker_250', 290, 427);
      simS.addReagentToVessel(bBa.id, 'h2o', 13.5, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bBa.id, 'h2so4_98', 1.65, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bBa.id, 'bacl2_2h2o', 2.44, { silentAnim: true, silentEmit: true });
      const bCaHCl = simS.createApparatus('beaker_250', 440, 427);
      simS.addReagentToVessel(bCaHCl.id, 'h2o', 10.0, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bCaHCl.id, 'hcl_37', 5.0, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bCaHCl.id, 'caco3', 4.0, { fine: false, silentAnim: true, silentEmit: true });
      const bCaH2SO4 = simS.createApparatus('beaker_250', 590, 427);
      simS.addReagentToVessel(bCaH2SO4.id, 'h2o', 13.5, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bCaH2SO4.id, 'h2so4_98', 1.65, { silentAnim: true, silentEmit: true });
      simS.addReagentToVessel(bCaH2SO4.id, 'caco3', 4.0, { fine: false, silentAnim: true, silentEmit: true });
      stepSeconds(simS, 3.0, 0.05);
      const nonVolOk = (bDil.escapedGasMoles?.SO3_g || 0) === 0 && (bDil.escapedGasMoles?.HCl_g || 0) === 0 && (bDil.escapedGasMoles?.NO2_g || 0) === 0;
      const baPptOk = (bBa.moles.BaSO4_s || 0) > 0.005;
      const caCrustOk = (bCaH2SO4.moles.CaSO4_s || 0) > 1e-4 && (bCaH2SO4.moles.CaCO3_s || 0) > (bCaHCl.moles.CaCO3_s || 0);

      // B. Concentrating dilute H2SO4 >78% regenerates H2SO4_l -> releases HCl from NaCl & SO3>=300C, 0 NO2 leak; plus NaHSO4 1:1 crystallization
      const simS2 = new LabSimulation();
      const bConc = simS2.createApparatus('beaker_250', 160, 427);
      bConc.moles = { H_aq: 0.2, SO4_2_aq: 0.1, H2O_l: 0.12 }; // w = 9.8 / (9.8+2.16) = 81.9% >= 78%
      stepSeconds(simS2, 1.0, 0.05);
      const reconvertedMol = bConc.moles.H2SO4_l || 0;
      simS2.addReagentToVessel(bConc.id, 'nacl', 2.0, { silentAnim: true, silentEmit: true });
      stepSeconds(simS2, 2.0, 0.05);
      const concReunlockOk = reconvertedMol > 0.05 && (bConc.escapedGasMoles?.HCl_g || 0) > 0.002 && (bConc.escapedGasMoles?.NO2_g || 0) === 0;

      const bAcidSalt = simS2.createApparatus('crucible_porcelain', 340, 427);
      bAcidSalt.moles = { Na_aq: 0.05, HSO4_aq: 0.05, H_aq: 0.005, SO4_2_aq: 0.005, H2O_l: 0.25 };
      stepSeconds(simS2, 1.5, 0.05);
      const bisulfateCrystOk = (bAcidSalt.moles.NaHSO4_s || 0) > 0.01;

      const bFumeHot = simS2.createApparatus('crucible_porcelain', 500, 427);
      bFumeHot.moles = { H2SO4_l: 0.1 };
      bFumeHot.tempK = 595.0; // 322 C -> above 300 C evolves SO3 mist
      stepSeconds(simS2, 1.0, 0.05);
      const hotSO3Ok = (bFumeHot.escapedGasMoles?.SO3_g || 0) > 1e-4 && (bFumeHot.escapedGasMoles?.NO2_g || 0) === 0;

      assert(
        'H2SO4 dil/conc parity: diluted H2SO4 2M non-fuming, BaSO4 ppt, CaSO4 crust slows coarse CaCO3 vs HCl, >78% reconverts H2SO4_l unlocking NaCl->HCl, NaHSO4 1:1 cryst & >=300C SO3 (0 NO2)',
        nonVolOk && baPptOk && caCrustOk && concReunlockOk && bisulfateCrystOk && hotSO3Ok,
        `nonVol=${nonVolOk}, baSO4=${baPptOk}(${(bBa.moles.BaSO4_s||0).toFixed(4)}), caCrust=${caCrustOk}(CaSO4=${(bCaH2SO4.moles.CaSO4_s||0).toFixed(4)},remH2SO4=${(bCaH2SO4.moles.CaCO3_s||0).toFixed(4)},remHCl=${(bCaHCl.moles.CaCO3_s||0).toFixed(4)}), reconv=${concReunlockOk}(molL=${reconvertedMol.toFixed(4)},HCl=${(bConc.escapedGasMoles?.HCl_g||0).toFixed(4)}), naHSO4=${bisulfateCrystOk}(${(bAcidSalt.moles.NaHSO4_s||0).toFixed(4)}), hotSO3=${hotSO3Ok}(${(bFumeHot.escapedGasMoles?.SO3_g||0).toFixed(4)})`
      );
    }

    // TEST 157: Prompt 39 (beta_v4+build.5) — 3D tilted meniscus parity (NO abnormal rise on tilt across round_flask_1000, beaker_1000, erlenmeyer_1000) & H2SO4 98% preview
    {
      const checkTiltedParity = (typeId, volMl) => {
        const spec = APPARATUS[typeId];
        const upY = computeVesselFluidGeometry(spec, 0, volMl).surfaceY;
        const smallTiltY = findTiltClipY3D(spec, volMl, 0.02);
        const modTiltY = findTiltClipY3D(spec, volMl, 0.21); // ~12 deg tilt
        const rimTopLocalY = -spec.height / 2 + 4;
        return {
          upY,
          smallTiltY,
          modTiltY,
          contOk: Math.abs(smallTiltY - upY) <= 4.0,
          noSpikeOk: modTiltY > rimTopLocalY + 12 && Math.abs(modTiltY - upY) <= 14.0,
        };
      };
      const rbf = checkTiltedParity('round_flask_1000', 994.0);
      const bk1 = checkTiltedParity('beaker_1000', 871.0);
      const erl1 = checkTiltedParity('erlenmeyer_1000', 851.0);
      const h2so4ConcReg = STARTER_REAGENTS.find((r) => r.id === 'h2so4_98');
      const noDilReg = !STARTER_REAGENTS.some((r) => r.id === 'h2so4_dil');
      const prevModeOk = h2so4ConcReg?.previewMode === 'acid_h2so4_conc' && noDilReg;

      assert(
        'Prompt 39 tilted meniscus 3D parity & H2SO4 preview: round_flask_1000/beaker_1000/erlenmeyer_1000 show <=4px tilt transition & zero abnormal level rise, h2so4_dil removed cleanly',
        rbf.contOk && rbf.noSpikeOk && bk1.contOk && bk1.noSpikeOk && erl1.contOk && erl1.noSpikeOk && prevModeOk,
        `rbf=(up=${rbf.upY.toFixed(1)},t0=${rbf.smallTiltY.toFixed(1)},t12=${rbf.modTiltY.toFixed(1)}), bk=(up=${bk1.upY.toFixed(1)},t12=${bk1.modTiltY.toFixed(1)}), erl=(up=${erl1.upY.toFixed(1)},t12=${erl1.modTiltY.toFixed(1)}), prev=${prevModeOk}`
      );
    }

    // TEST 158: Prompt 40 (virlab_beta_v4+build.6) — 3D hold volume for round_flask_1000@25°, Mg+H2O 3 regimes, Al powder vs foil in air, coarse vs fine solid visuals + 1000g Fe overflow in 50 mL tube, Spoon 2.8mL cap & Table, Splint mini-heater & Condenser FLIR
    {

      const liqAfter25 = computeLiquidVolumeL(rf.moles, rf.tempK) * 1000;
      const noPrematurePourOk = holdRbf25 > 600 && Math.abs(liqAfter25 - 165.7) < 1.5 && (rf.tiltPourRateMlS || 0) === 0;

      simAl.grindMortar(mAlFlat.id);
      mAlFlat.tempK = 955.0;
      stepSeconds(simAl, 1.5, 0.05);
      const alParityOk =
        (cAlPow.moles.Al2O3_s || 0) > 1e-4 &&

      assert(
        'Prompt 40 invariants: round_flask_1000@25° keeps 165.7mL, Mg+H2O 3 regimes, Al powder burns 550-760C vs non-burning foil/mortar, fine vs coarse assets + 1000g Fe overflow in 50mL tube, Spoon 2.8mL cap & Splint mini-heater',
        noPrematurePourOk && mgRegimeOk && alParityOk && solidOverflowOk && visualMetaOk && spoonCapOk && splintHeatOk,

      const bCold = simSol.createApparatus('beaker_250', 140, 427);

      const neutRedOk = (bNeutPer.moles.MnO2_s || 0) > 0.004 && (bNeutPer.escapedGasMoles?.O2_g || 0) > 0.005;
      const cl2KmnOk = (bHClCl2.escapedGasMoles?.Cl2_g || 0) > 0.005 && (bHClCl2.moles.Mn2_aq || 0) > 0.002;

      assert(

        solOk && thOk && acidRedOk && neutRedOk && cl2KmnOk && hazardOk && alkStabOk && dispropOk && catOk && mno2AcidOk && iupacKmno4Ok,
        `sol=${solOk}(cold=${coldMnO4Mol.toFixed(3)},hot=${hotMnO4Mol.toFixed(3)}), th=${thOk}, pH=(${acidRedOk}/${neutRedOk}), Cl2=${cl2KmnOk}, Mn2O7=${hazardOk}, K2=(${alkStabOk}/${dispropOk}), MnO2=(cat=${catOk},coldLeft=${(bMnColdAcid.moles.MnO2_s||0).toFixed(4)},Cl2=${cl2HotTot.toFixed(4)},Mn2=${(bMnHotHCl.moles.Mn2_aq||0).toFixed(4)},T=${(bMnHotHCl.tempK-273.15).toFixed(0)}C), iupac=${iupacKmno4Ok}`

      // 4) Halogen + OH- temperature matrix (Cl2, Br2, I2 @ 2C, 25C, 80C)
      const sim4 = new LabSimulation();
      const mkAlk = (x, halKey, halAmt, tK) => {

        v.moles = { H2O_l: 2.0, Na_aq: 0.2, OH_aq: 0.2, [halKey]: halAmt };

        stepVesselSurfaceWaves(bVisc, 0.02, 0, 0);
      }
      const postWater = Math.max(...bW._surfaceWave.h.map(Math.abs));
      const postAcid = Math.max(...bVisc._surfaceWave.h.map(Math.abs));
      const meanDriftW = Math.abs(bW._surfaceWave.h.reduce((s, x) => s + x, 0) / bW._surfaceWave.n);
      const waveOk =
        computeLiquidViscosityFactor(bVisc) > computeLiquidViscosityFactor(bW) * 2.2 &&
        peakWater > 0.4 &&
        postWater > postAcid * 2.0 &&
        meanDriftW < 1e-5;

      // 2) Tilted pouring into receiver transfers volume cleanly (slower when viscous) & excites surface ripple on receiver
      const bSrcW = simW.createApparatus('beaker_250', 540, 320);
      simW.addReagentToVessel(bSrcW.id, 'h2o', 120, { silentAnim: true });
      const bDstR = simW.createApparatus('beaker_250', 605, 427);
      simW.addReagentToVessel(bDstR.id, 'h2o', 40, { silentAnim: true });
      simW.setVesselTiltDeg(bSrcW.id, 65, 1);
      stepSeconds(simW, 1.0, 0.05);
      const dstWaveAfterPour = Math.max(...(bDstR._surfaceWave?.h || [0]).map(Math.abs));
      const pourOk = (bDstR.moles.H2O_l || 0) > 3.0 && dstWaveAfterPour > 0.02;

      // 3) 4 Solid Behavior Groups (1 free_granule, 2 hygroscopic_clump, 3 buoyant_float, 4 shrinking dissolution)
      const g1 = classifySolidBehavior('Zn_s', bW);
      const g2 = classifySolidBehavior('NaOH_s', bW);
      const g3 = classifySolidBehavior('Na_s', bW);
      const simSol = new LabSimulation();
      const bSol = simSol.createApparatus('beaker_250', 220, 427);
      bSol.moles = { H2O_l: 4.0, Na_s: 0.05, Zn_s: 0.05 };
      for (let i = 0; i < 40; i++) {
        stepVesselSolidBodies(bSol, true, 0.45, 1.0, 0.025);
      }
      const naBody = (bSol._solidBodies || []).find((b) => b.spId === 'Na_s');
      const znBody = (bSol._solidBodies || []).find((b) => b.spId === 'Zn_s');
      const rZnBefore = znBody ? znBody.r : 0;
      bSol.moles.Zn_s = 0.00625; // 1/8 moles -> radius halves (~0.5x)!
      stepVesselSolidBodies(bSol, true, 0.45, 1.0, 0.025);
      const rZnAfter = znBody ? znBody.r : 0;
      const solidsOk =
        g1.group === 1 &&
        g2.group === 2 &&
        g3.group === 3 &&
        Boolean(naBody && znBody && naBody.y < znBody.y) &&
        rZnAfter < rZnBefore * 0.65 &&
        rZnAfter > rZnBefore * 0.35;

      assert(
        'Prompt 47 invariants: 1D surface spring sloshing & H2SO4 viscosity damping (0 mean drift), pour impact wave ripple, 4 solid physics groups (buoyant Na vs sinking Zn, sticky NaOH, cbrt shrinking)',
        waveOk && pourOk && solidsOk,
        `wave=${waveOk}(viscRatio=${(computeLiquidViscosityFactor(bVisc)/computeLiquidViscosityFactor(bW)).toFixed(2)},w=${postWater.toFixed(3)},acid=${postAcid.toFixed(4)}), pour=${pourOk}(dstWave=${dstWaveAfterPour.toFixed(3)}), solids=${solidsOk}(g=${g1.group}/${g2.group}/${g3.group},NaY=${naBody?.y?.toFixed(1)}<ZnY=${znBody?.y?.toFixed(1)},shrink=${rZnBefore.toFixed(2)}->${rZnAfter.toFixed(2)})`
      );
    }

      stepSeconds(sim50, 2.0, 0.05);
      const cac2GasOk =

        cac2GasOk && cac2RedOk && sulfurAcidOk && adsOk && cRegimeOk,

    // TEST 169: Prompt 51 (virlab_beta_v4+build.17) — Metal+C Carbides (Ar/vacuum), Mg+S Flash + MgS Cold Hydrolysis, KI Solubility & I2+HNO3->HIO3, 100% H2SO4 Anhydrous Properties, Vacuum Thermal Decomps (NaOH, CuSO4.5H2O, KMnO4), Dat Den Thermal Air vs Inert, 'Dat den' UI Rename & Metal mp/bp at 1500 C
    {
      const totGas = (v, g) => (v.headspaceGasMoles?.[g] || 0) + (v.escapedGasMoles?.[g] || 0);

      // 1) Metal + Carbon in Inert Ar/Vacuum (air must NOT form carbides)
      const simMC = new LabSimulation();
      simMC.setAtmosphereMode('inert');
      const vK = simMC.createApparatus('crucible_porcelain', 120, 400);
      vK.moles = { K_s: 0.02, C_s: 0.24 };

      vMg1.moles = { Mg_s: 0.03, C_s: 0.08 };
      const vMg2 = simMC.createApparatus('crucible_porcelain', 480, 400);
      vMg2.moles = { Mg_s: 0.04, C_s: 0.08 };
      const vFe = simMC.createApparatus('crucible_porcelain', 600, 400);
      vFe.moles = { Fe_s: 0.06, C_s: 0.04 };
      const vZn = simMC.createApparatus('crucible_porcelain', 720, 400);
      vZn.moles = { Zn_s: 0.03, C_s: 0.06 };
      for (let i = 0; i < 40; i++) {

        vNa.tempK = 1073.15; // 800 C sealed -> Na2C2

        (vNa.moles.Na2C2_s || 0) > 0.005 &&

      const simHal = new LabSimulation();

        c2h2A > 0.005 &&
        Math.abs((vAInert.moles.Al_s || 0) - 0.02) < 1e-9 &&
        dryAcOk;

      assert(
        'Prompt 54 invariants: P+O2 render crash fixed, Absolute Ethanol & Glacial Acetic Acid full reactivity + physical constants',
        pFlameRenderOk && regOrgOk && etohOk && acohOk,
        `pRender=${pFlameRenderOk}, reg=${regOrgOk}, EtOH=${etohOk}, AcOH=${acohOk}(frz=${frozeBelow16},pH=${phAc01?.toFixed(2)}/${phBuf?.toFixed(2)},est=${(vAEster.moles.CH3COOC2H5_l||0).toFixed(3)})`

    }

      const sepDrop = simSep.createApparatus('separatory_funnel', 220, 260);
      sepDrop.moles = { C2H5OH_l: 0.3 };
      simSep.mountSeparatoryFunnel(sepDrop.id, boiler.id);
      simSep.setSeparatoryValveFlow(sepDrop.id, 0.5);
      simSep.toggleSeparatoryValve(sepDrop.id, true);
      for (let i = 0; i < 12; i++) simSep.step(0.05);
      const dropModeOk = sepDrop.mountedOnVesselId === boiler.id && (boiler.moles.C2H5OH_l || 0) > 0.01;

      //    5b) Extraction mode: C2H5Br (heavy) + H2O (aq) + EtOAc (light) -> drains bottom layer only & auto-closes cleanly at interface!
      const standSep = simSep.createApparatus('retort_stand', 432, 360);
      const sepExt = simSep.createApparatus('separatory_funnel', 460, 240);
      simSep.attachToStand(sepExt.id, standSep.id);
      const rcvBottom = simSep.createApparatus('beaker_250', 460, 430);
      sepExt.moles = { C2H5Br_l: 0.15, H2O_l: 1.0, CH3COOC2H5_l: 0.15 }; // ~11.2 mL heavy, ~18 mL aq, ~14.7 mL light
      simSep.shakeSeparatoryFunnel(sepExt.id);
      for (let i = 0; i < 60; i++) simSep.step(0.05); // settle emulsion
      simSep.setSeparatoryValveFlow(sepExt.id, 0.8);
      simSep.toggleSeparatoryValve(sepExt.id, true);
      for (let i = 0; i < 60; i++) simSep.step(0.05);
      const extOk =
        !sepExt.valveOpen &&
        (rcvBottom.moles.C2H5Br_l || 0) > 0.14 &&
        (rcvBottom.moles.H2O_l || 0) < 0.02 &&
        (sepExt.moles.H2O_l || 0) > 0.9 &&
        (sepExt.moles.CH3COOC2H5_l || 0) > 0.14;

      assert(
        'Prompt 59 invariants: Generalized organic Liebig condenser, Reflux vertical return, -20..200C thermostatic bath, Universal Raoult VLE + H2SO4 BPE, & ISO 4800 Separatory/Dropping Funnel (mount drop + 2-phase extraction interface auto-stop)',

      for (let i = 0; i < 8; i++) {
        vFco.tempK = 348.15; vFTol.tempK = 323.15; vGly.tempK = 298.15; vHcho4.tempK = 323.15; vCann.tempK = 313.15;
        vSap.tempK = 353.15; vHard.tempK = 448.15; vCh4.tempK = 298.15; vAcAg.tempK = 298.15; vBuna.tempK = 343.15;
        sim63.step(0.5);
      }

      const coOk = ((vFco.headspaceGasMoles?.CO_g || 0) + (vFco.escapedGasMoles?.CO_g || 0)) > 0.02;
      const fTolOk = (vFTol.moles.Ag_s || 0) > 0.03;
      const glyCuOk = (vGly.moles.CuC2H4O2_aq || 0) > 0.02;
      const hcho4Ok = (vHcho4.moles.Ag_s || 0) > 0.050; // 1:4 stoichiometry exceeds 2*0.02=0.04!
      const cannOk = (vCann.moles.CH3OH_l || 0) > 0.015 && (vCann.moles.HCOO_aq || 0) > 0.015;
      const lipOk = (vSap.moles.C17H33COO_aq || 0) > 0.05 && (vSap.moles.C3H5OH_3_l || 0) > 0.015 && (vHard.moles.C57H110O6_s || 0) > 0.015;
      const ch4Ok = ((vCh4.headspaceGasMoles?.CH3Cl_g || 0) + (vCh4.escapedGasMoles?.CH3Cl_g || 0)) > 0.02;
      const acAgOk = (vAcAg.moles.Ag2C2_s || 0) > 0.02;
      const bunaOk = (vBuna.moles.Buna_s || 0) > 0.02;

      assert(
        'Prompt 63 invariants: Formic CO/2Ag, Glycerol-Cu(OH)2 azure complex, HCHO 1:4 Tollens & Cannizzaro, Triolein soap/hardening, CH4+Cl2(UV), C2H2->Ag2C2↓, & C4H6->Buna rubber',
        coOk && fTolOk && glyCuOk && hcho4Ok && cannOk && lipOk && ch4Ok && acAgOk && bunaOk,
        `co=${coOk}, fTol=${fTolOk}, glyCu=${glyCuOk}, hcho4=${hcho4Ok}(Ag=${(vHcho4.moles.Ag_s||0).toFixed(3)}), cann=${cannOk}, lip=${lipOk}(soap=${(vSap.moles.C17H33COO_aq||0).toFixed(3)},fat=${(vHard.moles.C57H110O6_s||0).toFixed(3)}), ch4=${ch4Ok}, ag2c2=${acAgOk}(${(vAcAg.moles.Ag2C2_s||0).toFixed(3)}), buna=${bunaOk}(${(vBuna.moles.Buna_s||0).toFixed(3)})`
      );
    }

    // TEST 182: Prompt 64 — Extended Funnel Stem Alignment into Dual-Hole Stopper, Removal of HCHO/HCOOH from Starter Shelf (Prep from CH3OH), & Pure MeOH/Glycerol Liquid Volume Rendering
    {
      // 1) Funnel stem reaches straight into dual-hole stopper bore while pear bulb clears reflux condenser jacket
      const sim64 = new LabSimulation();
      const erl = sim64.createApparatus('erlenmeyer_250', 400, 360);
      const cond = sim64.createApparatus('liebig_condenser', 400, 220);
      cond.refluxMode = true;
      cond.refluxVesselId = erl.id;
      const sep = sim64.createApparatus('separatory_funnel', 400, 180);
      sim64.mountSeparatoryFunnel(sep.id, erl.id);
      sim64.step(0.05);
      const sfSpec = APPARATUS.separatory_funnel;
      const rimTop = erl.y - APPARATUS.erlenmeyer_250.height / 2;
      const funnelStemTipY = sep.y + sfSpec.height / 2 - 2;
      const funnelTaperEndY = (sep.y - sfSpec.height / 2) + 114;
      const condTopY = cond.y - (APPARATUS.liebig_condenser.width / 2);
      const funnelAlignOk =
        sfSpec.height >= 260 &&
        Math.abs(sep.x - erl.x + 8) < 1.5 &&
        Math.abs(sep.x - cond.x) >= 24 &&
        funnelStemTipY >= rimTop + 4 &&
        funnelTaperEndY < condTopY;

      // 2) HCHO and HCOOH removed from STARTER_REAGENTS, both preparable from CH3OH
      const noDirectHchoHcooh =
        STARTER_REAGENTS.length === 34 &&
        !STARTER_REAGENTS.some((r) => r.id === 'hcho_37' || r.id === 'hcooh') &&
        Boolean(SPECIES.HCHO_aq && SPECIES.HCOOH_l);
      const vPrepAld = sim64.createApparatus('round_flask_250', 180, 300);
      vPrepAld.moles.CH3OH_l = 0.3; vPrepAld.moles.Cr2O7_2_aq = 0.08; vPrepAld.moles.H_aq = 0.6; vPrepAld.moles.H2O_l = 0.4;
      const vPrepAcid = sim64.createApparatus('round_flask_250', 620, 300);
      vPrepAcid.moles.CH3OH_l = 0.3; vPrepAcid.moles.Cr2O7_2_aq = 0.12; vPrepAcid.moles.H_aq = 1.0; vPrepAcid.moles.H2O_l = 0.4;
      for (let i = 0; i < 6; i++) {
        vPrepAld.tempK = 330.15;
        vPrepAcid.tempK = 355.15;
        sim64.step(0.5);
      }
      const prepFromMeohOk = (vPrepAld.moles.HCHO_aq || 0) > 0.05 && (vPrepAcid.moles.HCOOH_l || 0) > 0.04;

      // 3) Pure MeOH & Glycerol render non-zero liquid volume & stratification!
      const vMe = sim64.createApparatus('beaker_250', 220, 460);
      vMe.moles.CH3OH_l = 1.0; // ~40.5 mL pure methanol
      const vGl = sim64.createApparatus('beaker_250', 580, 460);
      vGl.moles.C3H5OH_3_l = 0.5; // ~36.5 mL pure glycerol
      sim64.step(0.05);
      const meVolMl = computeAqueousVolumeL(vMe.moles, 298.15) * 1000;
      const glVolMl = computeAqueousVolumeL(vGl.moles, 298.15) * 1000;
      const stratMe = computePhaseStratification(vMe.moles, 298.15, APPARATUS.beaker_250, 0);
      const stratGl = computePhaseStratification(vGl.moles, 298.15, APPARATUS.beaker_250, 0);
      const liqVisualOk =
        meVolMl > 35 && meVolMl < 45 && stratMe.totalLiqMl > 35 &&
        glVolMl > 32 && glVolMl < 42 && stratGl.totalLiqMl > 32;

      assert(
        'Prompt 64 invariants: Funnel stem penetrates stopper bore cleanly beside condenser, HCHO/HCOOH removed from shelf & synthesized from CH3OH, pure MeOH & Glycerol liquid volumes render properly',
        funnelAlignOk && noDirectHchoHcooh && prepFromMeohOk && liqVisualOk,
        `funnel=${funnelAlignOk}(stemY=${funnelStemTipY.toFixed(1)}>=${(rimTop+4).toFixed(1)},taper=${funnelTaperEndY.toFixed(1)}<condTop=${condTopY.toFixed(1)},dx=${Math.abs(sep.x-cond.x).toFixed(1)}), shelf=${noDirectHchoHcooh}(n=${STARTER_REAGENTS.length}), prep=${prepFromMeohOk}(HCHO=${(vPrepAld.moles.HCHO_aq||0).toFixed(3)},HCOOH=${(vPrepAcid.moles.HCOOH_l||0).toFixed(3)}), liq=${liqVisualOk}(meMl=${meVolMl.toFixed(1)},glMl=${glVolMl.toFixed(1)})`
      );
    }

    // TEST 183: Prompt 65 — Smooth Arrhenius RK2 Ester & Lipid Saponification, Reversible Acid Equilibrium (< 100%), Emulsification & Soap Salting-Out Phenomena
    {
      const sim65 = new LabSimulation();
      // 1) Lipid saponification at 25 C vs 80 C: no instant 100% spike, smooth autocatalytic curve
      const vCold = sim65.createApparatus('beaker_250', 160, 300);
      vCold.moles.C57H104O6_l = 0.02; vCold.moles.OH_aq = 0.06; vCold.moles.Na_aq = 0.06; vCold.moles.H2O_l = 3.0;
      const vHot = sim65.createApparatus('beaker_250', 320, 300);
      vHot.moles.C57H104O6_l = 0.02; vHot.moles.OH_aq = 0.06; vHot.moles.Na_aq = 0.06; vHot.moles.H2O_l = 3.0;
      vHot.stirTimer = 5.0;

      // Initial 2-phase check before soap forms
      const stratStart = computePhaseStratification(vHot.moles, 298.15, APPARATUS.beaker_250, 0);
      const startTwoPhase = stratStart.isMultiPhase && stratStart.lightOrganicMl > 10 && stratStart.aqueousMl > 40;

      vCold.tempK = 298.15; vHot.tempK = 353.15;
      sim65.step(0.5);
      const hotSoap05 = vHot.moles.C17H33COO_aq || 0;
      for (let i = 0; i < 6; i++) {
        vCold.tempK = 298.15; vHot.tempK = 353.15; vHot.stirTimer = 3.0;
        sim65.step(0.5);
      }
      const hotSoap35 = vHot.moles.C17H33COO_aq || 0;
      const coldSoap = vCold.moles.C17H33COO_aq || 0;
      const smoothArrhOk =
        coldSoap < 0.004 &&
        hotSoap05 > 0.0005 && hotSoap05 < 0.025 &&
        hotSoap35 > hotSoap05 * 2 && hotSoap35 < 0.059;

      // 2) Lipid phenomena: milky soap emulsification & saturated NaCl salting-out curd
      const visSoap = computeSolutionVisuals(vHot.moles, 0.06, null, 4.5, null, 0, { phaseFilter: 'aqueous' });
      const stratMid = computePhaseStratification(vHot.moles, 353.15, APPARATUS.beaker_250, 0);
      const emulOk = visSoap.r > 215 && visSoap.g > 210 && visSoap.b > 200 && stratMid.lightOrganicMl < stratStart.lightOrganicMl * 0.7;

      vHot.moles.Na_aq = (vHot.moles.Na_aq || 0) + 0.35;
      vHot.moles.Cl_aq = 0.35;
      for (let i = 0; i < 6; i++) { vHot.tempK = 330.15; sim65.step(0.5); }
      const saltOutOk = (vHot.moles.C17H33COONa_s || 0) > 0.008;

      // 3) Reversible acid-catalyzed hydrolysis strictly < 100% (Kc = 0.28 for HCOOCH3 at 300 K)
      const vAcEst = sim65.createApparatus('round_flask_250', 500, 300);
      vAcEst.isStoppered = true;
      vAcEst.moles.HCOOCH3_l = 0.05; vAcEst.moles.H2O_l = 0.15; vAcEst.moles.H_aq = 0.08; vAcEst.moles.Cl_aq = 0.08;
      for (let i = 0; i < 20; i++) { vAcEst.tempK = 300.15; sim65.step(0.5); }
      const acYield = (vAcEst.moles.HCOOH_l || 0) / 0.05;
      const revEqOk = acYield > 0.15 && acYield < 0.85 && (vAcEst.moles.HCOOCH3_l || 0) > 0.005;

      assert(
        'Prompt 65 invariants: Arrhenius+RK2 smooth kinetics (no spike/no cold jump), reversible acid equilibrium (<100%), soap emulsification & brine salting-out curd',
        startTwoPhase && smoothArrhOk && emulOk && saltOutOk && revEqOk,
        `twoPhase=${startTwoPhase}, arrhRK2=${smoothArrhOk}(cold=${coldSoap.toFixed(4)},h0.5=${hotSoap05.toFixed(4)},h3.5=${hotSoap35.toFixed(4)}), emul=${emulOk}(rgb=${visSoap.r}/${visSoap.g}/${visSoap.b},oil=${stratStart.lightOrganicMl.toFixed(1)}->${stratMid.lightOrganicMl.toFixed(1)}), saltOut=${saltOutOk}(curd=${(vHot.moles.C17H33COONa_s||0).toFixed(4)}), revEq=${revEqOk}(yield=${(acYield*100).toFixed(1)}%)`
      );
    }

    runOrganicV5Tests(assert);

    // Render test report
    const passed = results.filter(r => r.pass).length;
    document.getElementById('summary').innerHTML = `<span class="${passed === results.length ? 'pass' : 'fail'}">${passed} / ${results.length} tests passed</span>`;
    document.getElementById('results').innerHTML = results.map(r =>
      `<li class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} — ${r.name} <span style="color:#94a3b8;font-weight:400">(${r.info})</span></li>`
    ).join('');
    document.getElementById('details').textContent = details.join('\n');
    window.__TEST_RESULTS__ = { total: results.length, passed, results };
  </script>
</body>
</html>
