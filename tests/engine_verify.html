    // TEST 115: NaCl Starter Reagent, Thermodynamics (801 °C mp, 1465 °C bp, Conductive Melt), Diaphragm vs Javelle Brine Electrolysis & Solvay Process
    {
      const naclReg = STARTER_REAGENTS.find((r) => r.id === 'nacl');
      const spNaCl = SPECIES.NaCl_s;
      const thermoOk =
        Boolean(naclReg && naclReg.speciesId === 'NaCl_s') &&
        Math.abs(spNaCl.meltTempK - 1074.15) < 0.5 &&
        Math.abs(spNaCl.boilTempK - 1738.15) < 0.5 &&
        spNaCl.noDecomp === true &&
        !spNaCl.decompTempK &&
        spNaCl.conductiveMelt === true;

      // 1) Solid NaCl (700 K) non-conductive vs Molten NaCl (1120 K >= 801 C) conductive electrolysis -> Na + Cl2(g)
      const simMelt = new LabSimulation();
      simMelt.environment.atmosphereMode = 'inert';
      const cruc = simMelt.createApparatus('crucible_porcelain', 300, 427);
      cruc.moles = { NaCl_s: 0.4 };
      cruc.tempK = 700.0;
      const elM1 = simMelt.createApparatus('electrode_rod', 288, 395);
      elM1.material = 'C';
      elM1.dockedVesselId = cruc.id;
      const elM2 = simMelt.createApparatus('electrode_rod', 312, 395);
      elM2.material = 'C';
      elM2.dockedVesselId = cruc.id;
      const dcM = simMelt.createApparatus('dc_power', 500, 420);
      dcM.posElectrodeId = elM1.id;
      dcM.negElectrodeId = elM2.id;
      simMelt.setDcPowerState(dcM.id, { voltageV: 8.0, powerOn: true });
      simMelt.step(0.05);
      const solidCurrentA = dcM.measuredCurrentA;
      cruc.tempK = 1120.0;
      for (let i = 0; i < 40; i++) {
        cruc.tempK = 1120.0;
        simMelt.step(0.1);
      }
      const moltenCurrentA = dcM.measuredCurrentA;
      const moltenMadeNaAndCl2 = (cruc.moles.Na_s || 0) > 5e-5 && (cruc.escapedGasMoles?.Cl2_g || 0) > 2e-5;

      // 2) Two-vessel Diaphragm/Salt-Bridge Brine Electrolysis -> pure NaOH(aq) + H2 at Cathode, Cl2 at Anode, zero ClO-
      const simDiaph = new LabSimulation();
      const bAn = simDiaph.createApparatus('beaker_250', 220, 427);
      bAn.moles = { H2O_l: 6.0, Na_aq: 0.6, Cl_aq: 0.6 };
      const bCath = simDiaph.createApparatus('beaker_250', 320, 427);
      bCath.moles = { H2O_l: 6.0, Na_aq: 0.3, Cl_aq: 0.3 };
      const sbD = simDiaph.createApparatus('salt_bridge', 270, 390);
      const elPosD = simDiaph.createApparatus('electrode_rod', 210, 410);
      elPosD.material = 'C';
      elPosD.dockedVesselId = bAn.id;
      const elNegD = simDiaph.createApparatus('electrode_rod', 330, 410);
      elNegD.material = 'C';
      elNegD.dockedVesselId = bCath.id;
      simDiaph.updateSupportAttachments();
      const dcD = simDiaph.createApparatus('dc_power', 520, 420);
      dcD.posElectrodeId = elPosD.id;
      dcD.negElectrodeId = elNegD.id;
      simDiaph.setDcPowerState(dcD.id, { voltageV: 8.0, powerOn: true });
      stepSeconds(simDiaph, 15.0, 0.1);
      const diaphOk =
        (bAn.escapedGasMoles?.Cl2_g || 0) > 5e-5 &&
        (bCath.escapedGasMoles?.H2_g || 0) > 5e-5 &&
        (bCath.moles.OH_aq || 0) > 1e-4 &&
        (bCath.moles.ClO_aq || 0) === 0 &&
        (bAn.moles.ClO_aq || 0) === 0;

      // 3) Single-vessel Brine Electrolysis (no diaphragm) -> forms Javelle ClO-(aq)
      const simJav = new LabSimulation();
      const bJav = simJav.createApparatus('beaker_250', 260, 427);
      bJav.moles = { H2O_l: 6.0, Na_aq: 0.6, Cl_aq: 0.6 };
      const elPJ = simJav.createApparatus('electrode_rod', 245, 410);
      elPJ.material = 'C';
      elPJ.dockedVesselId = bJav.id;
      const elNJ = simJav.createApparatus('electrode_rod', 275, 410);
      elNJ.material = 'C';
      elNJ.dockedVesselId = bJav.id;
      simJav.updateSupportAttachments();
      const dcJ = simJav.createApparatus('dc_power', 480, 420);
      dcJ.posElectrodeId = elPJ.id;
      dcJ.negElectrodeId = elNJ.id;
      simJav.setDcPowerState(dcJ.id, { voltageV: 8.0, powerOn: true });
      stepSeconds(simJav, 15.0, 0.1);
      const javelClO = bJav.moles.ClO_aq || 0;

      // 4) Solvay Process: Saturated NaCl + NH3 + CO2 -> NaHCO3(s) precipitate + NH4Cl(aq); then thermal calcination -> Na2CO3(s)
      const simSolv = new LabSimulation();
      const bSolv = simSolv.createApparatus('beaker_250', 300, 427);
      bSolv.moles = { H2O_l: 2.8, Na_aq: 0.30, Cl_aq: 0.30, NH3_aq: 0.14, H2CO3_aq: 0.14 };
      stepSeconds(simSolv, 3.0, 0.05);
      const nahco3Ppt = bSolv.moles.NaHCO3_s || 0;
      const nh4Formed = bSolv.moles.NH4_aq || 0;

      const crucRoast = simSolv.createApparatus('crucible_porcelain', 480, 427);
      crucRoast.moles = { NaHCO3_s: nahco3Ppt };
      crucRoast.tempK = 460.0;
      stepSeconds(simSolv, 5.0, 0.05);
      const na2co3Yield = crucRoast.moles.Na2CO3_s || 0;

      assert(
        'NaCl reagent & thermodynamics (801 °C mp conductive melt, 1465 °C bp, no decomp), diaphragm vs Javelle brine electrolysis & Solvay NaHCO3->Na2CO3 pass',
        thermoOk &&
          solidCurrentA === 0 &&
          moltenCurrentA > 0.3 &&
          moltenMadeNaAndCl2 &&
          diaphOk &&
          javelClO > 5e-5 &&
          nahco3Ppt > 0.015 &&
          nh4Formed > 0.08 &&
          na2co3Yield > 0.004,
        `thermo=${thermoOk}, I_solid=${solidCurrentA}, I_melt=${moltenCurrentA.toFixed(2)}A, diaph=${diaphOk}, ClO=${(javelClO*1000).toFixed(2)}mmol, NaHCO3=${(nahco3Ppt*1000).toFixed(1)}mmol, Na2CO3=${(na2co3Yield*1000).toFixed(1)}mmol`
      );
    }

    // TEST 116: Universal 4-Step (H+ + NO3-) Metal Filter & Electron-Conservation Auto-Balancer (Zn, Fe, Cu, HCl+NaNO3, 2NO+O2->2NO2)
    {
      const simOx = new LabSimulation();
      // 1) Zn + Concentrated HNO3 (68% ~15.17 M) -> NO2(g), ZERO H2(g)
      const bZnConc = simOx.createApparatus('beaker_250', 140, 427);
      simOx.addReagentToVessel(bZnConc.id, 'hno3_68', 25, { silentAnim: true, silentEmit: true });
      bZnConc.moles.Zn_s = 0.03;

      // 2) Zn + Moderately Dilute HNO3 (~2.2 M / ~13%) -> NO + N2O + N2 mix, ZERO H2(g)
      const bZnMed = simOx.createApparatus('beaker_250', 280, 427);
      simOx.addReagentToVessel(bZnMed.id, 'h2o', 55, { silentAnim: true, silentEmit: true });
      simOx.addReagentToVessel(bZnMed.id, 'hno3_68', 10, { silentAnim: true, silentEmit: true });
      bZnMed.moles.Zn_s = 0.03;

      // 3) Zn + Very Dilute HNO3 (~0.45 M / ~2.8%) -> NH4+(aq), ZERO H2(g)
      const bZnVeryDil = simOx.createApparatus('beaker_250', 420, 427);
      simOx.addReagentToVessel(bZnVeryDil.id, 'h2o', 160, { silentAnim: true, silentEmit: true });
      simOx.addReagentToVessel(bZnVeryDil.id, 'hno3_68', 5, { silentAnim: true, silentEmit: true });
      bZnVeryDil.moles.Zn_s = 0.03;

      // 4) Mixed HCl + NaNO3 (no HNO3 reagent!) + Cu(s) & Zn(s) -> oxidizes via (H+ + NO3-) with ZERO H2(g)
      const bMixCu = simOx.createApparatus('beaker_250', 560, 427);
      bMixCu.moles = { H2O_l: 3.0, H_aq: 0.12, Cl_aq: 0.12, Na_aq: 0.12, NO3_aq: 0.12, Cu_s: 0.025 };
      const bMixZn = simOx.createApparatus('beaker_250', 700, 427);
      bMixZn.moles = { H2O_l: 3.0, H_aq: 0.12, Cl_aq: 0.12, Na_aq: 0.12, NO3_aq: 0.12, Zn_s: 0.025 };

      // 5) Sealed flask with NO(g) + O2(g) -> spontaneous 2NO + O2 -> 2NO2
      const fNoOx = simOx.createApparatus('erlenmeyer_250', 840, 405);
      fNoOx.isStoppered = true;
      fNoOx.stopperMode = 'solid';
      fNoOx.headspaceGasMoles.NO_g = 0.004;
      fNoOx.headspaceGasMoles.O2_g = 0.003;

      stepSeconds(simOx, 4.0, 0.05);

      const zeroH2Everywhere =
        (bZnConc.escapedGasMoles?.H2_g || 0) === 0 &&
        (bZnMed.escapedGasMoles?.H2_g || 0) === 0 &&
        (bZnVeryDil.escapedGasMoles?.H2_g || 0) === 0 &&
        (bMixCu.escapedGasMoles?.H2_g || 0) === 0 &&
        (bMixZn.escapedGasMoles?.H2_g || 0) === 0;
      const znConcOk = (bZnConc.escapedGasMoles?.NO2_g || 0) > 0.001;
      const znMedOk =
        (bZnMed.escapedGasMoles?.NO_g || 0) > 1e-4 &&
        (bZnMed.escapedGasMoles?.N2O_g || 0) > 1e-4 &&
        (bZnMed.escapedGasMoles?.N2_g || 0) > 2e-5;
      const znVeryDilOk = (bZnVeryDil.moles.NH4_aq || 0) > 5e-5 && (bZnVeryDil.escapedGasMoles?.NO2_g || 0) === 0;
      const mixCuOk = (bMixCu.moles.Cu2_aq || 0) > 1e-4 && (bMixCu.escapedGasMoles?.NO_g || 0) > 5e-5;
      const mixZnOk = (bMixZn.moles.Zn2_aq || 0) > 5e-4;
      const noOxOk = (fNoOx.headspaceGasMoles.NO2_g || 0) > 0.002 && (fNoOx.headspaceGasMoles.NO_g || 0) < 0.002;

      // Verify exact mathematical balance of solveMetalNitrateStep for Zn (n=2) -> N2O (ep=8, kN=2, hP=10): 4Zn + 10H+ + 2NO3- -> 4Zn2+ + N2O + 5H2O
      const stN2O = solveMetalNitrateStep(0.4, 2, 10.0, 10.0, NITRATE_PRODUCTS.N2O);
      const mathExact =
        Math.abs(stN2O.deltaMetalIon - 0.4) < 1e-12 &&
        Math.abs(stN2O.deltaHPlus - (-1.0)) < 1e-12 &&
        Math.abs(stN2O.deltaNO3Minus - (-0.2)) < 1e-12 &&
        Math.abs(stN2O.deltaProduct - 0.1) < 1e-12 &&
        Math.abs(stN2O.deltaH2O - 0.5) < 1e-12;

      assert(
        '4-Step (H+ + NO3-) Metal Redox Solver blocks H2 completely, yields NO2 / NO+N2O+N2 / NH4+ by E0×[HNO3], handles HCl+NaNO3, and oxidizes 2NO+O2->2NO2',
        zeroH2Everywhere && znConcOk && znMedOk && znVeryDilOk && mixCuOk && mixZnOk && noOxOk && mathExact,
        `zeroH2=${zeroH2Everywhere}, znNO2=${(bZnConc.escapedGasMoles?.NO2_g||0).toFixed(4)}, znN2O=${(bZnMed.escapedGasMoles?.N2O_g||0).toFixed(4)}, znNH4=${(bZnVeryDil.moles.NH4_aq||0).toFixed(5)}, mixCu=${(bMixCu.moles.Cu2_aq||0).toFixed(4)}, no2Head=${(fNoOx.headspaceGasMoles.NO2_g||0).toFixed(4)}, math=${mathExact}`
      );
    }

    // TEST 120: Ba2+ Flame Test Loop (#84cc16 Apple-Green) + BaCl2.2H2O Dehydration (113 °C) + BaCl2 Thermal Properties (925 °C / 962 °C / 1560 °C)
    {

        sampledIon === 'Ba²⁺' &&

      assert(
        'Dropping NaOH into Phenolphthalein spawns localized upper concentration halo without instant full-liquid jump; spinning stir bar swirls vortex field',
        localizedOk && vortexSpun,
        `top=${topBefore.toFixed(2)}, bot=${botBefore.toFixed(2)}, swirlRad=${(f.swirlAngleRad||0).toFixed(2)}`
      );
    }

    // TEST 139: Prompt 31 — Signed Left/Right Wheel Tilt, Filter Funnel/Spoon Pour & Solid Particle Spill
    {
      const simT = new LabSimulation();
      const alerts = [];
      simT.visualHooks.onAlert = (type, item, meta) => alerts.push({ type, id: item?.id, meta });
      const bSrc = simT.createApparatus('beaker_250', 220, 320);
      bSrc.isDragging = true; // held aloft while tilting with wheel
      const bDst = simT.createApparatus('beaker_250', 274, 427);
      simT.addReagentToVessel(bSrc.id, 'caco3', 5, { fine: true, silentAnim: true });
      simT.addReagentToVessel(bSrc.id, 'h2o', 120, { silentAnim: true });

      simT.setVesselTiltDeg(bSrc.id, -65);
      const leftOk = bSrc.tiltDir === -1 && bSrc.tiltDeg === 65 && bSrc.tiltAngle < 0;
      simT.setVesselTiltDeg(bSrc.id, 65, 1);
      stepSeconds(simT, 0.7);
      const pouredBoth = (bDst.moles.H2O_l || 0) > 0.1 && (bDst.moles.CaCO3_s || 0) > 1e-4;
      const spilledEventsOk = alerts.some((a) => a.type === 'tilt_spill') && alerts.some((a) => a.type === 'tilt_solid_spill');

      const fnl = simT.createApparatus('filter_funnel', 420, 310);
      simT.addReagentToVessel(fnl.id, 'h2o', 25, { silentAnim: true });
      simT.setVesselTiltDeg(fnl.id, -55);
      stepSeconds(simT, 0.35);
      const fnlLost = (fnl.moles.H2O_l || 0) < (25 / 18.015) * 0.9;

      assert(
        'Signed wheel tilt rotates left (-)/right (+), pours liquids & dry solids cleanly to receivers, and supports filter funnel tilting',
        leftOk && pouredBoth && spilledEventsOk && fnlLost,
        `left=${leftOk}, h2o=${(bDst.moles.H2O_l||0).toFixed(2)}, ca=${(bDst.moles.CaCO3_s||0).toFixed(4)}, alerts=${alerts.map(a=>a.type).slice(0,4).join(',')}, fnlLost=${fnlLost}`
      );
    }

    // TEST 140: Prompt 31 — Burette Drop Alert, Pipette Dose Draw/Dispense & Breakable Ice Bath
    {
      const simB = new LabSimulation();
      const bAlerts = [];
      simB.visualHooks.onAlert = (type, item, meta) => bAlerts.push({ type, meta });
      const bur = simB.createApparatus('burette_50', 240, 220);
      const bRecv = simB.createApparatus('erlenmeyer_250', 240, 427);
      simB.addReagentToVessel(bur.id, 'hcl_37', 25, { silentAnim: true });
      const dVol = simB.buretteDispenseDrop(bur.id, 0.05);
      const dropEvt = bAlerts.find((a) => a.type === 'burette_drop');

      const pip = simB.createApparatus('pipette_10', 360, 400);
      simB.setPipetteDropDose(pip.id, 2.5);
      const srcP = simB.createApparatus('beaker_250', 360, 427);
      simB.addReagentToVessel(srcP.id, 'h2o', 30, { silentAnim: true });
      const drawn = simB.pipetteDrawFromVessel(srcP.id, pip.dropDoseMl, pip);
      const disp = simB.pipetteDispenseToVessel(bRecv.id, pip.dropDoseMl, pip);

      const bath = simB.createApparatus('ice_bath', 540, 140);
      const bathBreakable = APPARATUS.ice_bath.breakable === true && Number.isFinite(APPARATUS.ice_bath.fragilityDropPx);
      simB.handleLandingImpact(bath, 260, 600, null);
      const bathCooling = simB.getBathCoolingSource({ kind: 'vessel', typeId: 'beaker_250', x: 540, y: 427, isShattered: false });

      assert(
        'Burette dispense triggers drop animation, pipette draws/dispenses by dropDoseMl, and ice bath shatters on tall drops',
        dVol > 0.04 && Boolean(dropEvt) && Math.abs(drawn - 2.5) < 0.05 && Math.abs(disp - 2.5) < 0.05 && bathBreakable && bath.isBroken === true && !bathCooling,
        `dVol=${dVol.toFixed(2)}, drawn=${drawn.toFixed(2)}, disp=${disp.toFixed(2)}, bathBroken=${bath.isBroken}`
      );
    }

    // TEST 141: Prompt 31 — Electrode Collector Tube Live Telemetry Tooltip Data
    {
      const simE = new LabSimulation();
      const bEl = simE.createApparatus('beaker_250', 300, 427);
      simE.addReagentToVessel(bEl.id, 'h2o', 120, { silentAnim: true });
      simE.addReagentToVessel(bEl.id, 'nacl', 4, { silentAnim: true });
      const ePos = simE.createApparatus('electrode_rod', 280, 400);
      const eNeg = simE.createApparatus('electrode_rod', 320, 400);
      ePos.dockedVesselId = bEl.id;
      eNeg.dockedVesselId = bEl.id;
      const syrEl = simE.createApparatus('gas_syringe', 460, 320);
      simE.connectElectrodeCollector(eNeg.id, syrEl.id);
      const dc = simE.createApparatus('dc_power', 140, 420);
      dc.posElectrodeId = ePos.id;
      dc.negElectrodeId = eNeg.id;
      dc.voltageV = 9.0;
      dc.powerOn = true;
      stepSeconds(simE, 0.4);
      const syrHasH2 = (syrEl.gasMoles?.H2_g || 0) > 1e-6;
      const flowReady = Boolean(eNeg._liveTubeFlow && eNeg._liveTubeFlow.composition?.length > 0 && eNeg._liveTubeFlow.rateMlS > 0);
      assert(
        'Electrode collector tube routes gas into syringe and populates _liveTubeFlow tooltip telemetry',
        syrHasH2 && flowReady,
        `syrH2=${((syrEl.gasMoles?.H2_g || 0)*1e3).toFixed(4)}mmol, rate=${(eNeg._liveTubeFlow?.rateMlS || 0).toFixed(2)}mL/s`
      );
    }

    // TEST 142: Prompt 31 — Lowercase Canvas Mode & Multi-Spectral Optics Mode Persistence
    {
      const simO = new LabSimulation();
      simO.setOpticsMode('aerodynamics');
      const aeroOk = simO.environment.opticsMode === 'aerodynamics';
      simO.setOpticsMode('thermal');
      const thermOk = simO.environment.opticsMode === 'thermal';
      assert(
        'Multi-spectral optics switches cleanly between normal, aerodynamics, and thermal FLIR modes',
        aeroOk && thermOk,
        `aero=${aeroOk}, thermal=${thermOk}`
      );
    }

    // TEST 143: Prompt 31 — DOM Verification Anchor: Build 14 + CSS/Renderer Exports
    {
      const simA = new LabSimulation();
      assert(
        'Prompt 31 build 14 engine + optics verification suite completed',
        typeof simA.stepVesselTiltPouring === 'function' && typeof simA.buretteDispenseDrop === 'function',
        'build.14'
      );
    }

    // TEST 144: Prompt 32 — Tilted Flask Hold Parity (Erlenmeyer/Round Flask pour when meniscus reaches lip) & Zero Leftover at Max Pour
    {
      const simF = new LabSimulation();
      const erlF = simF.createApparatus('erlenmeyer_250', 220, 340);
      erlF.isDragging = true;
      simF.addReagentToVessel(erlF.id, 'h2o', 202, { silentAnim: true });
      simF.setVesselTiltDeg(erlF.id, 82, 1);
      stepSeconds(simF, 0.35);
      const afterErlMl = computeLiquidVolumeL(erlF.moles, erlF.tempK) * 1000;

      const rbfF = simF.createApparatus('round_flask_250', 420, 340);
      rbfF.isDragging = true;
      simF.addReagentToVessel(rbfF.id, 'h2o', 180, { silentAnim: true });
      simF.setVesselTiltDeg(rbfF.id, 86, 1);
      stepSeconds(simF, 0.35);
      const afterRbfMl = computeLiquidVolumeL(rbfF.moles, rbfF.tempK) * 1000;

      const bMaxA = simF.createApparatus('beaker_250', 600, 427);
      const bMaxB = simF.createApparatus('beaker_250', 740, 427);
      simF.addReagentToVessel(bMaxA.id, 'h2o', 24.83, { silentAnim: true });
      simF.pourBetweenVessels(bMaxA.id, bMaxB.id, 24.82, false);
      const remMaxMl = computeLiquidVolumeL(bMaxA.moles, bMaxA.tempK) * 1000;

      assert(
        'Tilted Erlenmeyer (~82°) & Round Flask (~86°) pour immediately at rim lip and max transfer leaves 0.00 mL residual',
        afterErlMl < 200 && afterRbfMl < 178 && remMaxMl <= 0.01,
        `erl=${afterErlMl.toFixed(1)}, rbf=${afterRbfMl.toFixed(1)}, remMax=${remMaxMl.toFixed(4)}`
      );
    }

    // TEST 145: Prompt 32 — Rotated Stopper & Tubing Port Track Vessel Tilt & Wobble
    {
      const simM = new LabSimulation();
      const vM = simM.createApparatus('erlenmeyer_250', 260, 427);
      const vDst = simM.createApparatus('beaker_250', 460, 427);
      const stopM = simM.createApparatus('rubber_stopper', 260, 340);
      simM.attachRubberStopper(stopM.id, vM.id, 'main');
      simM.connectTube(vM.id, vDst.id);
      const portUpright = simM.getMouthSlotCoords(vM, 'main');
      vM.landingTilt = 0.45;
      simM.syncAttachedMouthTools();
      const portTilted = simM.getMouthSlotCoords(vM, 'main');
      assert(
        'Attached rubber stopper and tubing ports track tilted/wobbling vessel mouth coordinates',
        Math.abs(portTilted.x - portUpright.x) > 12 && Math.abs(stopM.x - portTilted.x) < 1 && Math.abs(stopM._tiltRad - 0.45) < 0.01,
        `dx=${(portTilted.x - portUpright.x).toFixed(1)}, stopX=${stopM.x.toFixed(1)}`
      );
    }

    // TEST 146: Prompt 32 — 1-Hole Stopper Vents Pressure vs Solid Stopper Seals & Universal Submersion Ratio
    {
      const simH = new LabSimulation();
      const vHole = simH.createApparatus('erlenmeyer_250', 200, 427);
      const stopH = simH.createApparatus('rubber_stopper', 200, 340);
      simH.setStopperMode(stopH.id, 'holed');
      simH.attachRubberStopper(stopH.id, vHole.id, 'main');
      simH.addReagentToVessel(vHole.id, 'hcl_37', 25, { silentAnim: true });
      simH.addReagentToVessel(vHole.id, 'caco3', 3, { fine: true, silentAnim: true });
      stepSeconds(simH, 0.8);
      const holeP = vHole.internalPressureBar;

      const vSolid = simH.createApparatus('erlenmeyer_250', 380, 427);
      const stopS = simH.createApparatus('rubber_stopper', 380, 340);
      simH.setStopperMode(stopS.id, 'solid');
      simH.attachRubberStopper(stopS.id, vSolid.id, 'main');
      simH.addReagentToVessel(vSolid.id, 'hcl_37', 25, { silentAnim: true });
      simH.addReagentToVessel(vSolid.id, 'caco3', 0.35, { fine: true, silentAnim: true });
      stepSeconds(simH, 1.2);
      const solidP = vSolid.internalPressureBar;

      const condT = simH.createApparatus('liebig_condenser', 540, 260);
      const elT = simH.createApparatus('electrode_rod', 600, 380);
      const okCondSub = simH.setTubeSubmersionRatio(condT.id, 0.92) && Math.abs(condT.tubeSubmersionRatio - 0.92) < 0.01;
      const okElSub = simH.setTubeSubmersionRatio(elT.id, 0.15) && Math.abs(elT.tubeSubmersionRatio - 0.15) < 0.01;

      assert(
        '1-hole untubed stopper vents gas cleanly without pressurizing while solid stopper seals; submersionRatio adjusts vessel/condenser/electrode tubing',
        holeP <= 1.05 && solidP > 1.15 && okCondSub && okElSub,
        `holeP=${holeP.toFixed(2)}, solidP=${solidP.toFixed(2)}, condSub=${okCondSub}, elSub=${okElSub}`
      );
    }

    // TEST 147: Prompt 32 — Build 15 Verification Anchor
    {
      const simB15 = new LabSimulation();
      assert(
        'Prompt 32 build 15 engine & tubing consistency checks passed',
        typeof simB15.syncAttachedMouthTools === 'function',
        'build.15'
      );
    }

    // TEST 148: Prompt 33 — Gas Syringe w/ Gas Classified as Non-Empty Gas Entry in Cabinet
    {
      const lm = new LabManager();
      const s = lm.getActiveSim();
      s.clearBench?.();
      const syr = s.createApparatus('gas_syringe', 300, 320);
      syr.gasMoles = { H2_g: 0.008 };
      const entry = lm.storeItemToCabinet(syr.id, s);
      const out = lm.withdrawFromCabinet(entry.id, { mode: 'clone', simOverride: lm.labs[0].sim });
      assert(
        'Gas syringe containing gas is stored as non-empty gas entry in cabinet and restores gas intact',
        Boolean(entry?.hasChemicals) &&
          Array.isArray(entry?.speciesIds) &&
          entry.speciesIds.includes('H2_g') &&
          (out?.gasMoles?.H2_g || 0) > 0.007,
        `hasChem=${entry?.hasChemicals}, gas=${out?.gasMoles?.H2_g}`
      );
    }

    // TEST 149: Prompt 33 — Thermometer Probe, Rotated Floor Clamping, and Porcelain Dish Shelf Removal
    {
      const simTh = new LabSimulation();
      const bkHot = simTh.createApparatus('beaker_250', 260, 400);
      simTh.addReagentToVessel(bkHot.id, 'h2o', 80, { silentAnim: true });
      bkHot.tempK = 353.15;
      const th = simTh.createApparatus('thermometer', 260, 338);
      checkThermometerInteractions(simTh, th, 1.5);
      const condR = simTh.createApparatus('liebig_condenser', 450, 480);
      condR.rotationDeg = 45;
      const condMaxHalf = getItemRotatedHalfExtentY(APPARATUS.liebig_condenser, condR);
      const dishRemovedFromShelf = !APPARATUS_ORDER.includes('porcelain_dish');
      const thermOnShelf = APPARATUS_ORDER.includes('thermometer');
      assert(
        'Thermometer equilibrates with hot solution, rotated condenser half-extent prevents floor clipping, and porcelain_dish removed from shelf',
        th.measuredTempK > 345 && th.contactKind === 'vessel' && condMaxHalf > 60 && dishRemovedFromShelf && thermOnShelf,
        `T=${th.measuredTempK.toFixed(1)}K, halfY=${condMaxHalf.toFixed(1)}, noDish=${dishRemovedFromShelf}`
      );
    }

    // TEST 150: Prompt 33 — Mounted Filter Funnel Priority During Pouring
    {
      const simF = new LabSimulation();
      const rxv = simF.createApparatus('beaker_250', 420, 427);
      const fnl = simF.createApparatus('filter_funnel', 420, 330);
      fnl.mountedOnVesselId = rxv.id;
      fnl.restingOnId = rxv.id;
      const src = simF.createApparatus('beaker_250', 240, 427);
      src.moles = { H2O_l: 2.0, BaSO4_s: 0.02, Na_aq: 0.04, Cl_aq: 0.04 };
      simF.pourBetweenVessels(src.id, rxv.id, 30, true, { silentUndo: true });
      const solidInFunnel = fnl.moles.BaSO4_s || 0;
      const solidBypassedToRxv = rxv.moles.BaSO4_s || 0;
      assert(
        'Pouring targeting vessel holding mounted filter_funnel routes suspension through funnel (retains precipitate)',
        solidInFunnel > 0.005 && solidBypassedToRxv < 1e-6,
        `fnlBaSO4=${solidInFunnel.toFixed(4)}, rxvBaSO4=${solidBypassedToRxv.toFixed(4)}`
      );
    }

    // TEST 151: Prompt 33 — Expanded Dose Ceilings, Left-Right Flip, and Build 16 Anchor
    {
      const simB16 = new LabSimulation();
      const wb = simB16.createApparatus('wash_bottle', 300, 422);
      const flip0 = Boolean(wb.flippedX);
      const okFlip = simB16.flipItemLR(wb.id) && Boolean(wb.flippedX) !== flip0;
      const phenReg = STARTER_REAGENTS.find((r) => r.id === 'phen');
      const hclReg = STARTER_REAGENTS.find((r) => r.id === 'hcl_37');
      assert(
        'Starter reagents support generous maxDose, flipItemLR flips asymmetric tools, and build.16 invariants pass',
        okFlip && (phenReg?.maxDose || 0) >= 200 && (hclReg?.maxDose || 0) >= 500 && APPARATUS.iron_spoon.height > APPARATUS.iron_spoon.width,
        `flip=${okFlip}, phenMax=${phenReg?.maxDose}, hclMax=${hclReg?.maxDose}, spoon=${APPARATUS.iron_spoon.width}x${APPARATUS.iron_spoon.height}`
      );
    }

    // TEST 152: Prompt 34 — Full Freeze When Paused, Ctrl/SOS Themes & Visible Thermometer Draw
    {
      const simP = new LabSimulation();
      const bStir = simP.createApparatus('beaker_250', 260, 427);
      const sBar = simP.createApparatus('stir_bar', 260, 427);
      simP.insertStirBarIntoVessel(sBar.id, bStir.id, 800);
      simP.environment.paused = true;
      const phase0 = bStir.stirBarPhase || 0;
      simP.step(0.05);
      const phase1 = bStir.stirBarPhase || 0;
      const thP = simP.createApparatus('thermometer', 420, 400);
      assert(
        'Paused simulation freezes stirBarPhase and all chemistry/physics completely, and Ctrl/SOS theme + thermometer present',
        phase1 === phase0 && Boolean(I18N.vi.themeCtrl && I18N.vi.themeSos) && thP.kind === 'thermometer',
        `dPhase=${(phase1 - phase0).toFixed(2)}, thermId=${thP.id}`
      );
    }

    // Render test report
    const passed = results.filter(r => r.pass).length;
    document.getElementById('summary').innerHTML = `<span class="${passed === results.length ? 'pass' : 'fail'}">${passed} / ${results.length} tests passed</span>`;
    document.getElementById('results').innerHTML = results.map(r =>
      `<li class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} — ${r.name} <span style="color:#94a3b8;font-weight:400">(${r.info})</span></li>`
    ).join('');
    document.getElementById('details').textContent = details.join('\n');
    window.__TEST_RESULTS__ = { total: results.length, passed, results };
  </script>
</body>
</html>
