<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>virlab_v2 Engine Verification Suite</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 900px; margin: auto; }
    .pass { color: #34d399; font-weight: 600; }
    .fail { color: #f87171; font-weight: 700; }
    pre { background: #1e293b; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  </style>
</head>
<body>
  <h1>virlab_v2 — Chemistry &amp; Physics Verification</h1>
  <div id="summary">Running...</div>
  <ul id="results"></ul>
  <pre id="details"></pre>

  <script type="module">
    import { CONSTANTS, nonVolatileSoluteMoles, solutionBoilingPointK, waterBoilingPointK } from '../src/data/constants.js';
    import { APPARATUS, APPARATUS_ORDER, clampItemToStandY, getClampNeckOffsetY } from '../src/data/apparatus.js';
    import {
      GAS_DISPLAY_META,
      SORTED_BOTTOM_SOLID_SPECIES,
      SORTED_PRECIPITATE_SPECIES,
      SPECIES,
      STARTER_REAGENTS,
    } from '../src/data/species.js';
    import { REACTIONS } from '../src/data/reactions.js';
    import { computeVesselFluidGeometry } from '../src/canvas/vesselRenderer.js';
    import { renderVesselSolids } from '../src/canvas/chemicalVisuals.js';
    import { ParticleSystem } from '../src/canvas/particles.js';
    import { getReagentDragCanvas } from '../src/canvas/reagentRenderer.js';
    import {
      enforceDryPhaseBoundary,
      getEffectiveRateConstant,
      DRY_COMPLEX_DISSOCIATIONS,
      DRY_SALT_PAIRINGS,
    } from '../src/engine/chemistry.js';
    import { LabSimulation } from '../src/engine/simulation.js';
    import { calcEvaporationRateMol, computeSteamOpacity } from '../src/engine/thermodynamics.js';
    import {
      computeContentsMassG,
      computeLiquidVolumeL,
      computePH,
      computePhenolphthaleinAlpha,
      computeSolidVolumeMl,
      computeSolutionVisuals,
      solutionFreezingPointK,
    } from '../src/engine/equilibrium.js';
    import { EnvironmentBar } from '../src/ui/environmentBar.js';
    import { ShelfPanel } from '../src/ui/shelfPanel.js';
    import { InspectorPanel } from '../src/ui/inspectorPanel.js';
    import { LabWorkbenchCanvas } from '../src/canvas/workbench.js';
    import { I18N } from '../src/data/i18n.js';
    import {
      NON_STEAM_GASES,
      computeSyringeDischargeArc,
      computeSyringeGasVolumeMl,
      computeSyringeLiquidVolumeMl,
      computeSyringeTotalVolumeMl,
      computeTubingGeometry,
    } from '../src/engine/gasNetwork.js';

    const results = [];
    const details = [];

    function assert(name, cond, info = '') {
      results.push({ name, pass: !!cond, info });
    }

    function stepSeconds(sim, sec, dt = 0.02) {
      const steps = Math.round(sec / dt);
      for (let i = 0; i < steps; i++) sim.step(dt);
    }

    // TEST 1: Na + AgNO3(aq) Cascade, Mass Conservation & Gas Syringe PV=nRT
    {
      const sim = new LabSimulation();
      const flask = sim.createApparatus('erlenmeyer_250', 300, 380);
      const syringe = sim.createApparatus('gas_syringe', 600, 340);
      sim.connectSyringe(flask.id, syringe.id);

      // Add 50 mL H2O + 1.70 g AgNO3 (~0.01 mol)
      sim.addReagentToVessel(flask.id, 'h2o', 50);
      sim.addReagentToVessel(flask.id, 'agno3', 1.70, { fine: true });
      stepSeconds(sim, 3.0);

      const dissolvedAg = flask.moles.Ag_aq || 0;
      assert('AgNO3 dissolves completely in 50 mL H2O', dissolvedAg > 0.0099, `Ag⁺ = ${dissolvedAg.toFixed(5)} mol`);

      const massBeforeNa = computeContentsMassG(flask.moles);
      const naMass = 0.23;
      sim.addReagentToVessel(flask.id, 'na', naMass);
      const totalInputMass = massBeforeNa + naMass;

      stepSeconds(sim, 10.0);

      const nNaLeft = flask.moles.Na_s || 0;
      const nAg2O = flask.moles.Ag2O_s || 0;
      const nH2Collected = syringe.gasMoles.H2_g || 0;
      const syrVolMl = computeSyringeGasVolumeMl(syringe, sim.environment);
      const expectedVolMl = (nH2Collected * CONSTANTS.R_L_BAR_MOL_K * 298.15 / 1.0) * 1000;

      const finalMassTotal =
        computeContentsMassG(flask.moles) +
        (syringe.gasMoles.H2_g || 0) * SPECIES.H2_g.molarMass +
        (flask.escapedGasMoles.H2_g || 0) * SPECIES.H2_g.molarMass +
        (flask.escapedGasMoles.H2O_g || 0) * SPECIES.H2O_g.molarMass;

      assert('Na fully consumed in Na + AgNO3(aq)', nNaLeft < 1e-6, `Na_s left = ${nNaLeft}`);
      assert('Ag2O(s) precipitate forms automatically (~0.005 mol)', Math.abs(nAg2O - 0.005) < 0.0002, `Ag2O = ${nAg2O.toFixed(5)} mol`);
      assert('H2 collected stoichiometrically (~0.005 mol)', Math.abs(nH2Collected - 0.005) < 0.0002, `H2 = ${nH2Collected.toFixed(5)} mol`);
      assert('Syringe PV=nRT matches IUPAC molar volume (~124 mL)', Math.abs(syrVolMl - expectedVolMl) < 0.01 && syrVolMl > 120 && syrVolMl < 128, `V = ${syrVolMl.toFixed(2)} mL`);
      assert('Exact Mass Conservation holds (< 1e-5 g error)', Math.abs(totalInputMass - finalMassTotal) < 1e-5, `Δm = ${Math.abs(totalInputMass - finalMassTotal).toExponential(3)} g`);
      details.push(`Test 1 (Na + AgNO3): Ag2O=${nAg2O.toFixed(5)} mol, H2=${nH2Collected.toFixed(5)} mol (${syrVolMl.toFixed(2)} mL), T=${flask.tempK.toFixed(2)} K`);

      // Follow-up: Add excess HCl -> Ag2O turns into AgCl white precipitate!
      sim.addReagentToVessel(flask.id, 'hcl_37', 3.0);
      stepSeconds(sim, 3.0);
      assert('Adding HCl converts Ag2O(s) into AgCl(s)', (flask.moles.Ag2O_s || 0) < 1e-5 && (flask.moles.AgCl_s || 0) > 0.0095, `AgCl = ${(flask.moles.AgCl_s || 0).toFixed(5)} mol`);
    }

    // TEST 2: Open Vessel on Scale Loses Mass Equal to Escaped H2
    {
      const sim = new LabSimulation();
      const scale = sim.createApparatus('scale', 250, 440);
      const beaker = sim.createApparatus('beaker_250', 250, 340);
      sim.updateSupportAttachments();
      sim.addReagentToVessel(beaker.id, 'h2o', 50);
      sim.addReagentToVessel(beaker.id, 'hcl_37', 10);
      sim.tareScale(scale.id);
      sim.addReagentToVessel(beaker.id, 'zn', 0.6538, { fine: true }); // 0.01 mol Zn
      const massStart = scale.measuredG;
      stepSeconds(sim, 25.0);
      const massEnd = scale.measuredG;
      const escapedH2Mass = (beaker.escapedGasMoles.H2_g || 0) * SPECIES.H2_g.molarMass;
      let totalEscaped = 0;
      for (const [gId, mol] of Object.entries(beaker.escapedGasMoles)) {
        if (mol > 0 && SPECIES[gId]) totalEscaped += mol * SPECIES[gId].molarMass;
      }
      assert('Open Zn + HCl loses scale weight equal to escaped gases + vapor', escapedH2Mass > 0.015 && Math.abs((massStart - massEnd) - totalEscaped) < 1e-4, `Scale drop=${(massStart - massEnd).toFixed(4)} g, Escaped=${totalEscaped.toFixed(4)} g (H2=${escapedH2Mass.toFixed(4)} g)`);
    }

    // TEST 3: Amphoteric Zn(OH)2 -> [Zn(OH)4]2- -> Zn(OH)2
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'h2o', 40);
      sim.addReagentToVessel(b.id, 'zn', 0.3269, { fine: true }); // 0.005 mol Zn
      sim.addReagentToVessel(b.id, 'hcl_37', 1.5); // ~0.018 mol H+
      stepSeconds(sim, 30.0);
      // Add moderate NaOH to precipitate Zn(OH)2 (neutralizes ~0.008 mol excess H+ and adds ~0.01 mol OH-)
      sim.addReagentToVessel(b.id, 'naoh', 0.72, { fine: true });
      stepSeconds(sim, 4.0);
      const pptPeak = b.moles.ZnOH2_s || 0;
      // Add excess NaOH -> redissolves!
      sim.addReagentToVessel(b.id, 'naoh', 2.0, { fine: true });
      stepSeconds(sim, 8.0);
      const pptAfterExcess = b.moles.ZnOH2_s || 0;
      const zincate = b.moles.ZnOH4_2_aq || 0;
      assert('Amphoteric Zn(OH)2 precipitates then dissolves in excess NaOH', pptPeak > 0.003 && pptAfterExcess < 1e-4 && zincate > 0.0045, `Peak Zn(OH)2=${pptPeak.toFixed(4)}, After=${pptAfterExcess.toFixed(5)}, [Zn(OH)4]2-=${zincate.toFixed(4)}`);
    }

    // TEST 4: Boiling Point at 1.00 bar vs 0.50 bar & Cu(OH)2 -> CuO Thermal Decomposition
    {
      const bp1 = waterBoilingPointK(1.0);
      const bp05 = waterBoilingPointK(0.5);
      assert('Antoine boiling point: ~99.6 °C at 1 bar, ~81.3 °C at 0.5 bar', Math.abs(bp1 - 372.76) < 0.3 && Math.abs(bp05 - 354.5) < 0.5, `bp(1bar)=${(bp1-273.15).toFixed(2)}°C, bp(0.5bar)=${(bp05-273.15).toFixed(2)}°C`);

      const sim = new LabSimulation();
      const burner = sim.createApparatus('burner', 300, 426);
      const beaker = sim.createApparatus('beaker_250', 300, 302);
      sim.updateSupportAttachments();
      sim.setBurnerFlame(burner.id, 3);
      sim.addReagentToVessel(beaker.id, 'h2o', 30);
      sim.addReagentToVessel(beaker.id, 'cuso4_5h2o', 1.25, { fine: true });
      sim.addReagentToVessel(beaker.id, 'naoh', 0.60, { fine: true });
      stepSeconds(sim, 30.0);
      assert('Heating Cu(OH)2 >= 80°C thermally decomposes to black CuO(s)', beaker.restingOnId === burner.id && (beaker.moles.CuO_s || 0) > 0.004 && (beaker.moles.CuOH2_s || 0) < 0.0005, `CuO=${(beaker.moles.CuO_s || 0).toFixed(5)} mol, T=${(beaker.tempK-273.15).toFixed(1)}°C`);
    }

    // TEST 5: Exact pH & Phenolphthalein Indicator
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'h2o', 100);
      sim.addReagentToVessel(b.id, 'phen', 0.1);
      const liq1 = computeLiquidVolumeL(b.moles, b.tempK);
      const ph1 = computePH(b.moles, liq1, b.tempK);
      const a1 = computePhenolphthaleinAlpha(ph1);

      sim.addReagentToVessel(b.id, 'naoh', 0.04, { fine: true }); // ~0.01 M OH-
      stepSeconds(sim, 2.0);
      const liq2 = computeLiquidVolumeL(b.moles, b.tempK);
      const ph2 = computePH(b.moles, liq2, b.tempK);
      const a2 = computePhenolphthaleinAlpha(ph2);

      assert('Water pH=7.00 (colorless) -> Base pH~12.0 (pink Phenolphthalein)', Math.abs(ph1 - 7.0) < 0.05 && a1 < 0.02 && ph2 > 11.5 && a2 > 0.99, `pH1=${ph1.toFixed(2)} (α=${a1.toFixed(3)}), pH2=${ph2.toFixed(2)} (α=${a2.toFixed(3)})`);

      // Check pink RGB hue (high red & blue, absorbed green) and [OH-] concentration dependence
      const visPink = computeSolutionVisuals(b.moles, liq2, ph2);
      const aFaint = computePhenolphthaleinAlpha(8.8, 6.3e-6);
      const aBleach = computePhenolphthaleinAlpha(14.3, 2.0);
      assert(
        'Phenolphthalein renders rose-pink (not crimson red) and scales/bleaches with [OH⁻]',
        visPink.r > 200 && visPink.b > 150 && visPink.b > visPink.g * 2 && aFaint > 0.15 && aFaint < 0.40 && aBleach < 0.15,
        `RGB(${visPink.r},${visPink.g},${visPink.b}), α(pH8.8)=${aFaint.toFixed(2)}, α(2M OH⁻)=${aBleach.toFixed(2)}`
      );
    }

    // TEST 6: Overpressure pops rubber stopper
    {
      const sim = new LabSimulation();
      const tube = sim.createApparatus('test_tube_50', 300, 360);
      sim.addReagentToVessel(tube.id, 'h2o', 15);
      sim.addReagentToVessel(tube.id, 'hcl_37', 5);
      sim.toggleStopper(tube.id);
      sim.addReagentToVessel(tube.id, 'zn', 0.65, { fine: true });
      stepSeconds(sim, 8.0);
      assert('Sealed tube overpressure pops rubber stopper automatically', tube.isStoppered === false && sim.logs.some(l => l.key === 'alertOverpressurePop'), `isStoppered=${tube.isStoppered}`);
    }

    // TEST 7: Concentrated NaOH volume/density realism & stable extreme pH
    {
      const moles = { H2O_l: 50 / 18.01528, Na_aq: 1.25, OH_aq: 1.25 }; // 50g H2O + 50g NaOH (50% w/w)
      const volMl = computeLiquidVolumeL(moles, 298.15) * 1000;
      const density = 100 / volMl;
      const ph298 = computePH(moles, volMl / 1000, 298.15);
      assert('50% NaOH(aq) has realistic volume (~64-72 mL) & density (~1.4-1.56 g/mL)', volMl > 62 && volMl < 74 && density > 1.35 && density < 1.60, `V=${volMl.toFixed(1)} mL, ρ=${density.toFixed(2)} g/mL`);
      assert('Extreme base pH at 298.15 K computes cleanly without cancellation', ph298 > 15.0 && ph298 <= 15.6, `pH(298K)=${ph298.toFixed(2)}`);
    }

    // TEST 8: Dropping 50 g Na into 200 mL H2O triggers runaway H2 ignition explosion & spills all contents
    {
      const sim = new LabSimulation();
      const beaker = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(beaker.id, 'h2o', 200);
      sim.addReagentToVessel(beaker.id, 'na', 50);
      stepSeconds(sim, 8.0);
      const leftoverVolMl = computeLiquidVolumeL(beaker.moles, beaker.tempK) * 1000;
      const leftoverMassG = computeContentsMassG(beaker.moles);
      assert(
        'Huge 50g Na in 200 mL H2O triggers runaway explosion, shatters beaker & spills all contents',
        beaker.isShattered === true && beaker.tempK > 330 && leftoverVolMl === 0 && leftoverMassG === 0 && sim.logs.some(l => l.key === 'alertNaExplosion'),
        `isShattered=${beaker.isShattered}, T=${(beaker.tempK-273.15).toFixed(1)}°C, leftMass=${leftoverMassG.toFixed(2)}g`
      );
    }

    // TEST 9: NaOH solubility saturation in 5 mL hydroalcoholic Phenolphthalein 1%
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'phen', 5.0);
      sim.addReagentToVessel(b.id, 'naoh', 25.0);
      stepSeconds(sim, 12.0);
      const undissolvedG = (b.moles.NaOH_s || 0) * SPECIES.NaOH_s.molarMass;
      const dissolvedMol = b.moles.Na_aq || 0;
      assert(
        '25 g NaOH in 5 mL Phenolphthalein 1% (60% EtOH/39% H2O) saturates & leaves excess solid NaOH(s)',
        undissolvedG > 18.0 && dissolvedMol > 0.04 && dissolvedMol < 0.16,
        `undissolved=${undissolvedG.toFixed(2)}g, dissolved=${(dissolvedMol * SPECIES.NaOH_s.molarMass).toFixed(2)}g`
      );
    }

    // TEST 10: Phenolphthalein 4th state (H3In+ orange-red at pH < 0 in conc. HCl 37%)
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'hcl_37', 20.0);
      sim.addReagentToVessel(b.id, 'phen', 0.2);
      const liq = computeLiquidVolumeL(b.moles, b.tempK);
      const ph = computePH(b.moles, liq, b.tempK);
      const vis = computeSolutionVisuals(b.moles, liq, ph, 6.5, b.phenBleachFrac);
      assert(
        'Concentrated HCl 37% (pH < 0) turns Phenolphthalein orange-red (H3In+)',
        ph < -0.5 && vis.hasIndicatorOrange === true && vis.r > 180 && vis.g > 60 && vis.g < 155 && vis.b < 60,
        `pH=${ph.toFixed(2)}, RGB(${vis.r},${vis.g},${vis.b})`
      );
    }

    // TEST 11: Phenolphthalein flash-pink-then-fade in conc. NaOH (2 M) & reversible recovery on dilution
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'h2o', 50);
      sim.addReagentToVessel(b.id, 'naoh', 4.0, { fine: true }); // ~2.0 M NaOH
      stepSeconds(sim, 3.0); // Dissolve NaOH
      sim.addReagentToVessel(b.id, 'phen', 0.15);

      const liq1 = computeLiquidVolumeL(b.moles, b.tempK);
      const ph1 = computePH(b.moles, liq1, b.tempK);
      const cOH1 = (b.moles.OH_aq || 0) / liq1;
      const alphaFlash = computePhenolphthaleinAlpha(ph1, cOH1, b.phenBleachFrac);

      stepSeconds(sim, 8.0);
      const alphaFaded = computePhenolphthaleinAlpha(ph1, cOH1, b.phenBleachFrac);

      // Dilute strongly with distilled water (brings [OH-] down ~4x -> reversible recovery)
      sim.addReagentToVessel(b.id, 'h2o', 200);
      stepSeconds(sim, 6.0);
      const liq2 = computeLiquidVolumeL(b.moles, b.tempK);
      const ph2 = computePH(b.moles, liq2, b.tempK);
      const cOH2 = (b.moles.OH_aq || 0) / liq2;
      const alphaRecovered = computePhenolphthaleinAlpha(ph2, cOH2, b.phenBleachFrac);

      assert(
        'Phenolphthalein flashes pink then fades in ~2 M NaOH, and recovers pink upon water dilution',
        alphaFlash > 0.85 && alphaFaded < 0.18 && alphaRecovered > 0.35 && alphaRecovered > alphaFaded * 2,
        `flash=${alphaFlash.toFixed(2)} -> faded=${alphaFaded.toFixed(2)} -> diluted=${alphaRecovered.toFixed(2)}`
      );
    }

    // TEST 12: Boiling CuSO4 + HCl(aq) dry -> [CuCl4]2- green complex -> dry anhydrous CuSO4(s), 0 (aq) ions, tracked HCl(g) & H2O(g), capped ~250-300C
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      const burner = sim.createApparatus('burner', 300, 380);
      sim.setBurnerFlame(burner.id, 3);
      b.restingOnId = burner.id;

      sim.addReagentToVessel(b.id, 'cuso4_5h2o', 2.4968, { fine: true }); // ~0.0100 mol CuSO4.5H2O
      sim.addReagentToVessel(b.id, 'hcl_37', 8.0); // ~0.0965 mol HCl
      const initTotalMassG = computeContentsMassG(b.moles);

      stepSeconds(sim, 2.5, 0.02);
      const midCompMol = b.moles.CuCl4_2_aq || 0;
      const hasComplex = midCompMol > 0.002;
      const liqMid = computeLiquidVolumeL(b.moles, b.tempK);
      const visMid = computeSolutionVisuals(b.moles, liqMid, computePH(b.moles, liqMid, b.tempK));

      // Heat until completely dry and thermal equilibrium is reached (~160s)
      stepSeconds(sim, 160.0, 0.05);

      const finalLiqMl = computeLiquidVolumeL(b.moles, b.tempK) * 1000;
      const anyAqLeft = Object.entries(b.moles).some(([id, n]) => SPECIES[id]?.phase === 'aq' && n > 1e-10);
      const dryCuSO4Mol = b.moles.CuSO4_s || 0;
      const escHCl = b.escapedGasMoles.HCl_g || 0;
      const escH2O = b.escapedGasMoles.H2O_g || 0;
      const finalMassTotalG =
        computeContentsMassG(b.moles) +
        escHCl * SPECIES.HCl_g.molarMass +
        escH2O * SPECIES.H2O_g.molarMass;
      const dryTempC = b.tempK - CONSTANTS.KELVIN_OFFSET;

      assert(
        'CuSO4 + HCl(aq) forms green [CuCl4]2- in solution and turns greenish',
        hasComplex && visMid.g > visMid.b,
        `[CuCl4]2-=${midCompMol.toFixed(4)} mol, RGB(${visMid.r},${visMid.g},${visMid.b})`
      );
      assert(
        'Boiling CuSO4 + HCl dry leaves 0 mL liquid, ZERO (aq) ions, anhydrous CuSO4(s), tracked HCl(g)+H2O(g) & exact mass',
        finalLiqMl === 0 && !anyAqLeft && Math.abs(dryCuSO4Mol - 0.01) < 0.0005 && escHCl > 0.09 && escH2O > 0.3 && Math.abs(finalMassTotalG - initTotalMassG) < 1e-4,
        `liq=${finalLiqMl.toFixed(2)}mL, anyAq=${anyAqLeft}, CuSO4(s)=${dryCuSO4Mol.toFixed(4)}, HCl(g)=${(escHCl*1000).toFixed(1)}mmol, Δm=${Math.abs(finalMassTotalG - initTotalMassG).toExponential(2)}g`
      );
      assert(
        'Dry beaker on High alcohol burner stabilizes realistically around 250-300 °C (no runaway)',
        dryTempC >= 250 && dryTempC <= 300,
        `T_dry=${dryTempC.toFixed(1)}°C`
      );
    }

    // TEST 13: Cu(OH)2 + excess HCl boiled dry -> CuCl2(s) -> CuCl(s) + Cl2(g) above 255 C
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      const burner = sim.createApparatus('burner', 300, 380);
      sim.setBurnerFlame(burner.id, 3);
      b.restingOnId = burner.id;

      // Directly prepare Cu(OH)2(s) suspension + excess HCl -> pure CuCl2(aq)
      b.moles.CuOH2_s = 0.02;
      sim.addReagentToVessel(b.id, 'hcl_37', 5.0);
      stepSeconds(sim, 140.0, 0.05);

      const finalLiqMl = computeLiquidVolumeL(b.moles, b.tempK) * 1000;
      const cuclMol = b.moles.CuCl_s || 0;
      const cl2Mol = b.escapedGasMoles.Cl2_g || 0;
      const anyAqLeft = Object.entries(b.moles).some(([id, n]) => SPECIES[id]?.phase === 'aq' && n > 1e-10);
      assert(
        'Cu(OH)2 + excess HCl boils dry to CuCl2(s) and thermally decomposes into CuCl(s) + Cl2(g) at burner plateau',
        finalLiqMl === 0 && !anyAqLeft && cuclMol > 0.005 && cl2Mol > 0.0025,
        `CuCl(s)=${cuclMol.toFixed(4)} mol, CuCl2(s)=${(b.moles.CuCl2_s || 0).toFixed(4)} mol, Cl2(g)=${(cl2Mol*1000).toFixed(2)}mmol`
      );
    }

    // TEST 14: Stirring speeds up heterogeneous (solid-liquid) reactions & surface evaporation, NOT homogeneous ionic neutralization
    {
      // Compare Zn + HCl still vs stirred
      const runHet = (stir) => {
        const s = new LabSimulation();
        const b = s.createApparatus('beaker_250', 300, 350);
        s.addReagentToVessel(b.id, 'h2o', 40);
        s.addReagentToVessel(b.id, 'hcl_37', 5);
        s.addReagentToVessel(b.id, 'zn', 1.3, { fine: false });
        if (stir) s.stirVessel(b.id);
        stepSeconds(s, 2.0, 0.02);
        return b.escapedGasMoles.H2_g || 0;
      };
      const hetStill = runHet(false);
      const hetStir = runHet(true);

      // Compare homogeneous H+ + OH- neutralization still vs stirred over 0.1 s
      const runHom = (stir) => {
        const s = new LabSimulation();
        const b = s.createApparatus('beaker_250', 300, 350);
        b.moles = { H2O_l: 5.0, H_aq: 0.05, Cl_aq: 0.05, Na_aq: 0.05, OH_aq: 0.05 };
        if (stir) s.stirVessel(b.id);
        stepSeconds(s, 0.1, 0.01);
        return b.moles.H_aq || 0;
      };
      const homStill = runHom(false);
      const homStir = runHom(true);

      // Compare surface evaporation at 70 C still vs stirred
      const runEvap = (stir) => {
        const s = new LabSimulation();
        const b = s.createApparatus('beaker_250', 300, 350);
        s.addReagentToVessel(b.id, 'h2o', 80);
        b.tempK = 343.15;
        if (stir) s.stirVessel(b.id);
        stepSeconds(s, 3.0, 0.05);
        return b.escapedGasMoles.H2O_g || 0;
      };
      const evapStill = runEvap(false);
      const evapStir = runEvap(true);

      assert(
        'Stirring boosts heterogeneous Zn+HCl (>2x) and surface evaporation (~2x), while homogeneous ionic reaction stays unchanged',
        hetStir > hetStill * 2.0 && evapStir > evapStill * 1.7 && Math.abs(homStir - homStill) < 1e-6,
        `het=${(hetStir/hetStill).toFixed(2)}x, evap=${(evapStir/evapStill).toFixed(2)}x, Δhom=${Math.abs(homStir-homStill).toExponential(1)}`
      );
    }

    // TEST 15: Antoine + Raoult + Dalton heating curve (surface area, solute lowering, pre-boil curvature -> steady T_boil)
    {
      // Compare wide beaker vs narrow test tube sub-boiling evaporation at 353 K
      const simA = new LabSimulation();
      const wide = simA.createApparatus('beaker_250', 250, 350);
      const narrow = simA.createApparatus('test_tube_50', 450, 350);
      simA.addReagentToVessel(wide.id, 'h2o', 40);
      simA.addReagentToVessel(narrow.id, 'h2o', 40);
      wide.tempK = 353.15;
      narrow.tempK = 353.15;
      stepSeconds(simA, 4.0, 0.05);
      const wideEvap = wide.escapedGasMoles.H2O_g || 0;
      const narrowEvap = narrow.escapedGasMoles.H2O_g || 0;

      // Measure dT/dt at low T (~40 C) vs high sub-boiling T (~92 C) under 650 W burner, and boiling plateau
      const simB = new LabSimulation();
      const bk = simB.createApparatus('beaker_250', 300, 350);
      const bn = simB.createApparatus('burner', 300, 380);
      simB.setBurnerFlame(bn.id, 3);
      bk.restingOnId = bn.id;
      simB.addReagentToVessel(bk.id, 'h2o', 100);

      bk.tempK = 313.15; // 40 C
      stepSeconds(simB, 2.0, 0.02);
      const slopeLow = (bk.tempK - 313.15) / 2.0;

      bk.tempK = 365.15; // 92 C
      stepSeconds(simB, 2.0, 0.02);
      const slopeHigh = (bk.tempK - 365.15) / 2.0;

      // Reach Regime 2 boiling plateau and hold dT ≈ 0 while liquid remains
      stepSeconds(simB, 15.0, 0.05);
      const tBoil1 = bk.tempK;
      stepSeconds(simB, 5.0, 0.05);
      const tBoil2 = bk.tempK;

      assert(
        'Antoine+Raoult+Dalton model: wide surface evaporates faster than tube, heating bends before boiling, and Regime 2 locks at T_boil',
        wideEvap > narrowEvap * 5.0 && slopeHigh < slopeLow * 0.85 && Math.abs(tBoil2 - tBoil1) < 0.05 && Math.abs((tBoil2 - 273.15) - 99.63) < 0.25,
        `beaker/tube=${(wideEvap/narrowEvap).toFixed(1)}x, slope40=${slopeLow.toFixed(2)}K/s vs slope92=${slopeHigh.toFixed(2)}K/s, T_boil=${(tBoil2-273.15).toFixed(2)}°C`
      );
    }

    // TEST 16: ISO 1773 / ISO 3819 glassware specs, frustum Erlenmeyer meniscus calibration, & Low vs Tall beaker surface evaporation
    {
      const low = APPARATUS.beaker_250;
      const tall = APPARATUS.beaker_tall_250;
      const erl = APPARATUS.erlenmeyer_250;

      // Verify ISO 3819 (70x95 mm low, 60x120 mm tall) & ISO 1773 (85x144 mm, neck 32 mm, wall 0.8 mm)
      const isoSpecsOk =
        low.diameterMm === 70 && low.heightMm === 95 && low.wallThicknessMm >= 1.1 &&
        tall.diameterMm === 60 && tall.heightMm === 120 && tall.wallThicknessMm >= 1.1 &&
        erl.diameterMm === 85 && erl.heightMm >= 140 && erl.heightMm <= 145 && erl.neckDiameterMm >= 30 && erl.wallThicknessMm >= 0.8;

      // Verify conical frustum height increments grow cleanly upward: Δy(200->250) > Δy(0->50)
      const g = computeVesselFluidGeometry(erl, 300, 0);
      const dyBot50 = g.volumeMlToY(0) - g.volumeMlToY(50);
      const dyTop50 = g.volumeMlToY(200) - g.volumeMlToY(250);

      // Compare Low Form (36.1 cm2) vs Tall Form (26.2 cm2) sub-boiling evaporation at 353 K
      const sim = new LabSimulation();
      const bLow = sim.createApparatus('beaker_250', 250, 350);
      const bTall = sim.createApparatus('beaker_tall_250', 450, 350);
      sim.addReagentToVessel(bLow.id, 'h2o', 80);
      sim.addReagentToVessel(bTall.id, 'h2o', 80);
      bLow.tempK = 353.15;
      bTall.tempK = 353.15;
      stepSeconds(sim, 4.0, 0.05);
      const lowEvap = bLow.escapedGasMoles.H2O_g || 0;
      const tallEvap = bTall.escapedGasMoles.H2O_g || 0;

      assert(
        'ISO 3819 / ISO 1773 dimensions, conical frustum graduations, & Low > Tall surface evaporation hold',
        isoSpecsOk && dyTop50 > dyBot50 * 2.5 && lowEvap > tallEvap * 1.25,
        `dy(200-250)=${dyTop50.toFixed(1)}px > dy(0-50)=${dyBot50.toFixed(1)}px, evap(Low/Tall)=${(lowEvap/tallEvap).toFixed(2)}x`
      );
    }

    // TEST 17: VesselGeometry frustum profile drives dynamic Dalton evaporation (narrow neck < wide cone belly, & test tube heel tapers)
    {
      const erlGeom = APPARATUS.erlenmeyer_250.geometry;
      const tubeGeom = APPARATUS.test_tube_50.geometry;
      const s250 = erlGeom.getLiquidState(250);
      const s60 = erlGeom.getLiquidState(60);
      const tLow = tubeGeom.getLiquidState(1.0);
      const tMid = tubeGeom.getLiquidState(25.0);

      // Compare Erlenmeyer evaporation rate when filled near narrow neck (245 mL) vs mid wide belly (70 mL)
      const sim = new LabSimulation();
      const fFull = sim.createApparatus('erlenmeyer_250', 250, 350);
      const fLow = sim.createApparatus('erlenmeyer_250', 500, 350);
      sim.addReagentToVessel(fFull.id, 'h2o', 245);
      sim.addReagentToVessel(fLow.id, 'h2o', 70);
      fFull.tempK = 353.15;
      fLow.tempK = 353.15;
      stepSeconds(sim, 4.0, 0.05);
      const evapFull = fFull.escapedGasMoles.H2O_g || 0;
      const evapLow = fLow.escapedGasMoles.H2O_g || 0;

      assert(
        'VesselGeometry dynamic surface area: Erlenmeyer widens as water drops (70 mL evaporates >3x faster than 245 mL) & U-bottom tapers cleanly',
        s60.surfaceAreaCm2 > s250.surfaceAreaCm2 * 3.5 && tLow.surfaceAreaCm2 < tMid.surfaceAreaCm2 && evapLow > evapFull * 3.0,
        `A(60mL)=${s60.surfaceAreaCm2.toFixed(1)} vs A(250mL)=${s250.surfaceAreaCm2.toFixed(1)}cm², evap(70/245)=${(evapLow/evapFull).toFixed(2)}x`
      );
    }

    // TEST 18: True physical brim overflow (past 250 mL stays inside glass until ~353 mL rim, then spills gradually)
    {
      const sim = new LabSimulation();
      const b = sim.createApparatus('beaker_250', 300, 350);
      sim.addReagentToVessel(b.id, 'h2o', 250);
      sim.addReagentToVessel(b.id, 'h2o', 50); // 300 mL > 250 mL mark, < 353 mL physical brim!
      stepSeconds(sim, 0.5, 0.02);
      const vol300 = computeLiquidVolumeL(b.moles, b.tempK) * 1000;
      const noEarlyOverflow = Math.abs(vol300 - 300) < 1.5 && (b.overflowRateMlS || 0) === 0;

      // Now exceed physical brim (~353 mL) -> gradual cascading overflow instead of instant snap!
      sim.addReagentToVessel(b.id, 'h2o', 120); // 420 mL -> ~67 mL over rim!
      sim.step(0.05);
      const midOverflowRate = b.overflowRateMlS || 0;
      const midVol = computeLiquidVolumeL(b.moles, b.tempK) * 1000;

      stepSeconds(sim, 3.0, 0.02);
      const endVol = computeLiquidVolumeL(b.moles, b.tempK) * 1000;
      const brimMl = APPARATUS.beaker_250.geometry.maxVolumeMl * 0.96;

      assert(
        '300 mL stays below physical rim (~353 mL); exceeding rim cascades gradually down to brim rather than snapping instantly',
        noEarlyOverflow && midOverflowRate > 20 && midVol > brimMl + 10 && Math.abs(endVol - brimMl) < 1.5 && (b.overflowRateMlS || 0) === 0,
        `vol(300)=${vol300.toFixed(1)}mL, midRate=${midOverflowRate.toFixed(1)}mL/s (midV=${midVol.toFixed(1)}), settled=${endVol.toFixed(1)}mL (brim=${brimMl.toFixed(1)})`
      );
    }

    // TEST 19: CuSO4.5H2O crystal dehydration emits visible hot steam & collects/condenses inside Gas Syringe with mass conservation
    {
      // Part A: Open beaker dehydration tracks H2O(g) + gasTempK + converts crystals to white CuSO4(s)
      const simOpen = new LabSimulation();
      const bnOpen = simOpen.createApparatus('burner', 300, 426);
      const bkOpen = simOpen.createApparatus('beaker_250', 300, 302);
      simOpen.updateSupportAttachments();
      simOpen.setBurnerFlame(bnOpen.id, 3);
      simOpen.addReagentToVessel(bkOpen.id, 'cuso4_5h2o', 2.4968, { fine: true }); // 0.01 mol -> 0.05 mol H2O
      stepSeconds(simOpen, 35.0, 0.05);
      const openSteamMol = bkOpen.escapedGasMoles.H2O_g || 0;
      const openCuSO4Mol = bkOpen.moles.CuSO4_s || 0;

      // Part B: Connected to Gas Syringe -> steam flows into syringe, warms barrel, condenses to H2O(l), & retracts on cooling
      const sim = new LabSimulation();
      const bn = sim.createApparatus('burner', 300, 426);
      const flask = sim.createApparatus('erlenmeyer_250', 300, 302);
      const syr = sim.createApparatus('gas_syringe', 620, 340);
      sim.updateSupportAttachments();
      sim.connectSyringe(flask.id, syr.id);
      sim.addReagentToVessel(flask.id, 'cuso4_5h2o', 2.4968, { fine: true });
      const initMassG = computeContentsMassG(flask.moles);

      sim.setBurnerFlame(bn.id, 3);
      let peakVolMl = 0;
      let peakTempK = syr.tempK;
      for (let i = 0; i < 45; i++) {
        stepSeconds(sim, 1.0, 0.04);
        const v = computeSyringeGasVolumeMl(syr, sim.environment);
        if (v > peakVolMl) peakVolMl = v;
        if (syr.tempK > peakTempK) peakTempK = syr.tempK;
      }

      // Cool down after burner off -> remaining steam condenses & plunger pulls back
      sim.setBurnerFlame(bn.id, 0);
      stepSeconds(sim, 12.0, 0.05);
      const cooledVolMl = computeSyringeGasVolumeMl(syr, sim.environment);
      const condensedMol = syr.condensedWaterMol || 0;

      const totalWaterSteamCollected =
        (syr.gasMoles.H2O_g || 0) +
        condensedMol +
        (flask.headspaceGasMoles.H2O_g || 0) +
        (flask.escapedGasMoles.H2O_g || 0) +
        (flask.moles.H2O_l || 0);
      const totalMassAfterG =
        computeContentsMassG(flask.moles) +
        ((syr.gasMoles.H2O_g || 0) + condensedMol + (flask.headspaceGasMoles.H2O_g || 0) + (flask.escapedGasMoles.H2O_g || 0)) * SPECIES.H2O_g.molarMass;

      assert(
        'Heating dry CuSO4·5H2O drives off hot steam (≥100 °C), enters Gas Syringe, heats barrel, condenses H2O(l) & retracts on cooling with exact mass balance',
        openSteamMol > 0.035 &&
          openCuSO4Mol > 0.007 &&
          (bkOpen.lastGasOutTempK || 0) >= 373 &&
          peakVolMl > 12 &&
          peakTempK > 303 &&
          condensedMol > 0.015 &&
          cooledVolMl < peakVolMl &&
          totalWaterSteamCollected > 0.025 &&
          Math.abs(initMassG - totalMassAfterG) < 1e-4,
        `openH2O=${(openSteamMol*1000).toFixed(1)}mmol@${((bkOpen.lastGasOutTempK||298)-273.15).toFixed(0)}°C, syrPeak=${peakVolMl.toFixed(1)}mL->${cooledVolMl.toFixed(1)}mL, Tsyr=${(peakTempK-273.15).toFixed(1)}°C, cond=${(condensedMol*SPECIES.H2O_l.molarMass).toFixed(3)}g, Δm=${Math.abs(initMassG-totalMassAfterG).toExponential(2)}g`
      );
    }

    // TEST 20: Boiling pure water collects steam in Gas Syringe, heats & condenses inside barrel without false failure
    {
      const sim = new LabSimulation();
      const bn = sim.createApparatus('burner', 300, 426);
      const tube = sim.createApparatus('test_tube_50', 300, 300);
      const syr = sim.createApparatus('gas_syringe', 620, 340);
      sim.updateSupportAttachments();
      sim.connectSyringe(tube.id, syr.id);
      sim.addReagentToVessel(tube.id, 'h2o', 15);
      sim.setBurnerFlame(bn.id, 3);

      let peakVolMl = 0;
      for (let i = 0; i < 30; i++) {
        stepSeconds(sim, 1.0, 0.04);
        const v = computeSyringeGasVolumeMl(syr, sim.environment);
        if (v > peakVolMl) peakVolMl = v;
      }
      const hotSyrTempK = syr.tempK;

      sim.setBurnerFlame(bn.id, 0);
      stepSeconds(sim, 10.0, 0.05);
      const coolVolMl = computeSyringeGasVolumeMl(syr, sim.environment);
      const condMl = ((syr.condensedWaterMol || 0) * SPECIES.H2O_l.molarMass) / 0.997;

      assert(
        'Boiling water streams hot steam into Gas Syringe (plunger expands, barrel heats up, water condenses inside & plunger retracts when cooled)',
        peakVolMl > 40 && hotSyrTempK > 330 && condMl > 0.25 && coolVolMl < peakVolMl,
        `peak=${peakVolMl.toFixed(1)}mL->cool=${coolVolMl.toFixed(1)}mL, Tsyr=${(hotSyrTempK-273.15).toFixed(1)}°C, condensed=${condMl.toFixed(2)}mL`
      );
    }

    // TEST 21: Hard stopper without tubing NEVER spills outside rim while closed; exceeding brim pops stopper via hydraulic pressure
    {
      const sim = new LabSimulation();
      const flask = sim.createApparatus('erlenmeyer_250', 300, 380);
      let popFired = false;
      sim.visualHooks.onAlert = (type) => {
        if (type === 'pop') popFired = true;
      };
      sim.addReagentToVessel(flask.id, 'h2o', 250);
      sim.toggleStopper(flask.id);
      const stillClosed = flask.isStoppered === true && (flask.overflowRateMlS || 0) === 0;

      // Exceed physical brim (~275 mL) with hard cork in place -> must pop stopper cleanly & then spill!
      sim.addReagentToVessel(flask.id, 'h2o', 60);
      stepSeconds(sim, 2.5, 0.02);

      assert(
        'Hard stopper blocks premature rim overflow; exceeding brim hydraulically pops stopper then spills',
        stillClosed && popFired && flask.isStoppered === false && sim.logs.some(l => l.key === 'alertHydroOverflowPop'),
        `initiallyStoppered=${stillClosed}, popFired=${popFired}, finalStoppered=${flask.isStoppered}`
      );
    }

    // TEST 22: Stopper with Ø6.0 mm calibrated tubing fills tube volume by measured arc length first, then streams into next Vessel & Gas Syringe
    {
      // Part A: Tubing length-dependent hold-up volume + Vessel A -> Vessel B transfer
      const simV = new LabSimulation();
      const src = simV.createApparatus('erlenmeyer_250', 220, 380);
      const dstClose = simV.createApparatus('beaker_250', 420, 410);
      const dstFar = simV.createApparatus('beaker_250', 760, 410);
      const gClose = computeTubingGeometry(src, dstClose);
      const gFar = computeTubingGeometry(src, dstFar);

      simV.connectTube(src.id, dstClose.id);
      const brimMl = APPARATUS.erlenmeyer_250.geometry.maxVolumeMl * 0.96;
      const smallExcess = Math.max(1.5, gClose.capacityMl * 0.45);
      simV.addReagentToVessel(src.id, 'h2o', brimMl + smallExcess);
      stepSeconds(simV, 1.5, 0.02);
      const tubeHeldOnlyMl = computeLiquidVolumeL(src.tubeMoles, src.tubeTempK) * 1000;
      const dstBeforeFull = computeLiquidVolumeL(dstClose.moles, dstClose.tempK) * 1000;

      // Push well past tube capacity -> spills into dstClose
      simV.addReagentToVessel(src.id, 'h2o', 40);
      stepSeconds(simV, 3.0, 0.02);
      const tubeFullMl = computeLiquidVolumeL(src.tubeMoles, src.tubeTempK) * 1000;
      const dstAfterFull = computeLiquidVolumeL(dstClose.moles, dstClose.tempK) * 1000;

      // Part B: Vessel -> Gas Syringe overflow, plunger expansion & >250 mL syringe rear overflow
      const simS = new LabSimulation();
      const f2 = simS.createApparatus('erlenmeyer_250', 240, 380);
      const syr = simS.createApparatus('gas_syringe', 600, 340);
      const gSyr = computeTubingGeometry(f2, syr);
      simS.connectTube(f2.id, syr.id);
      simS.addReagentToVessel(f2.id, 'h2o', brimMl + gSyr.capacityMl + 85);
      stepSeconds(simS, 4.0, 0.02);
      const syrLiqMl = computeSyringeLiquidVolumeMl(syr, simS.environment);
      const syrTotMl = computeSyringeTotalVolumeMl(syr, simS.environment);

      // Push huge volume past 250 mL syringe max -> rear overflow triggered & clamped cleanly near 250 mL
      let syrOverflowFired = false;
      simS.visualHooks.onAlert = (type) => {
        if (type === 'syringe_overflow') syrOverflowFired = true;
      };
      simS.addReagentToVessel(f2.id, 'h2o', 230);
      stepSeconds(simS, 4.0, 0.02);
      const syrEndTotMl = computeSyringeTotalVolumeMl(syr, simS.environment);

      assert(
        'Calibrated Ø6mm tubing measures length capacity accurately, holds small excess before spilling to Vessel B & floods Gas Syringe up to 250 mL overflow',
        gFar.arcLengthCm > gClose.arcLengthCm + 20 &&
          gFar.capacityMl > gClose.capacityMl + 5 &&
          Math.abs(tubeHeldOnlyMl - smallExcess) < 0.8 &&
          dstBeforeFull < 0.1 &&
          Math.abs(tubeFullMl - gClose.capacityMl) < 0.5 &&
          dstAfterFull > 25 &&
          (src.overflowRateMlS || 0) === 0 &&
          Math.abs(syrLiqMl - 85) < 3.5 &&
          Math.abs(syrTotMl - syrLiqMl) < 0.2 &&
          syrOverflowFired &&
          syrEndTotMl <= 251.5,
        `TubeClose=${gClose.arcLengthCm.toFixed(1)}cm(${gClose.capacityMl.toFixed(1)}mL) vs Far=${gFar.arcLengthCm.toFixed(1)}cm(${gFar.capacityMl.toFixed(1)}mL), Held=${tubeHeldOnlyMl.toFixed(1)}mL(dst=${dstBeforeFull.toFixed(1)}), dstAfter=${dstAfterFull.toFixed(1)}mL, Syr=${syrLiqMl.toFixed(1)}mL->End=${syrEndTotMl.toFixed(1)}mL`
      );
    }

    // TEST 23: International Apparatus Standards (ISO 4142 Test Tube 50mL, Gas Syringe 250mL specs, & continuous 0-650W burner power)

    // TEST 24: Drag-and-drop bench Pipette 10 mL draws up to 10 mL from vessel A and dispenses cleanly to vessel B with animations & mass conservation
    {
      const sim = new LabSimulation();
      const b1 = sim.createApparatus('beaker_250', 220, 350);

    // TEST 25: Gas Syringe extraction methods (gravity stream catch, pipette draw, direct pump) & visible Cl2 filaments vs invisible H2 plume
    {
      const sim = new LabSimulation();
      const ps = new ParticleSystem();
      sim.visualHooks.onParticlesNeeded = (it, m) => ps.emitForVessel(it, m, 0.02);

      const stand = sim.createApparatus('retort_stand', 560, 482 - APPARATUS.retort_stand.height / 2 + 2);
      const syr = sim.createApparatus('gas_syringe', 515, 290);
      sim.attachToStand(syr.id, stand.id);
      const catcher = sim.createApparatus('beaker_250', 385, 482 - APPARATUS.beaker_250.height / 2 + 2);
      const pip = sim.createApparatus('pipette_10', 220, 482 - APPARATUS.pipette_10.height / 2 + 2);

      // Load condensate + NaOH solution into syringe and verify aligned parabolic stream catches into catcher
      syr.condensedWaterMol = 1.0; // ~18 mL H2O
      syr.overflowMoles = { H2O_l: 0.5, Na_aq: 0.05, OH_aq: 0.05 };
      syr.gasMoles.Cl2_g = 0.002;

      const bpPureEtOH = solutionBoilingPointK({ C2H5OH_l: 1.0 }, 1.0) - CONSTANTS.KELVIN_OFFSET;
      const bpAz = solutionBoilingPointK({ C2H5OH_l: 0.894, H2O_l: 0.106 }, 1.0) - CONSTANTS.KELVIN_OFFSET;
      const bpPhen60 = solutionBoilingPointK({ C2H5OH_l: 0.375, H2O_l: 0.625 }, 1.0) - CONSTANTS.KELVIN_OFFSET;

      // 2) Boiling Phen 1% co-distills Ethanol faster than Water (unlike old water-only boil!) & condenses Ethanol in cool flask
      const sim = new LabSimulation();
      const burner = sim.createApparatus('burner', 220, 428);
      sim.setBurnerFlame(burner.id, 3);
      const flaskSrc = sim.createApparatus('erlenmeyer_250', 220, 310);
      const flaskDst = sim.createApparatus('beaker_250', 480, 429);
      sim.addReagentToVessel(flaskSrc.id, 'phen', 25); // 25 mL 60% w/w EtOH + 39% w/w H2O
      const etohStart = flaskSrc.moles.C2H5OH_l;
      const h2oStart = flaskSrc.moles.H2O_l;
      sim.connectTube(flaskSrc.id, flaskDst.id);

      stepSeconds(sim, 30.0, 0.05);

      const etohLeftFrac = (flaskSrc.moles.C2H5OH_l || 0) / etohStart;

          Math.abs(bpAz - 77.89) < 0.35 &&

    // TEST 47: v2 4-Class Arrhenius Kinetics (Ionic Group 1, Diffusion-capped Hetero Group 2, Thermal-locked Group 3, Volatile NH3 Group 4)
    {
      const neut = REACTIONS.find((r) => r.id === 'neutralization');
      const znHCl = REACTIONS.find((r) => r.id === 'zn_acid');
      const znNO3 = REACTIONS.find((r) => r.id === 'zn_nitrate_nh3');

      const g1_298 = getEffectiveRateConstant(neut, 298.15, false);
      const g1_348 = getEffectiveRateConstant(neut, 348.15, false);
      const g2_still85 = getEffectiveRateConstant(znHCl, 358.15, false);

      const g2_unbounded85 = znHCl.k298 * Math.exp((-znHCl.eaJ / CONSTANTS.R_J_MOL_K) * (1 / 358.15 - 1 / 298.15));
      const g3_298 = getEffectiveRateConstant(znNO3, 298.15, false);
      const g3_355 = getEffectiveRateConstant(znNO3, 355.15, false);

      // Group 4: Open heated NH3 burner vessel outgasses significantly compared to cool NH3
      const sim = new LabSimulation();
      const burner = sim.createApparatus('burner', 220, 428);
      sim.setBurnerFlame(burner.id, 3);
      const hotB = sim.createApparatus('beaker_250', 220, 310);
      const coolB = sim.createApparatus('beaker_250', 460, 429);
      sim.addReagentToVessel(hotB.id, 'h2o', 40);
      sim.addReagentToVessel(hotB.id, 'nh3_25', 10);
      sim.addReagentToVessel(coolB.id, 'h2o', 40);
      sim.addReagentToVessel(coolB.id, 'nh3_25', 10);
      hotB.tempK = 358.15;
      sim.updateSupportAttachments();
      const nh3Init = hotB.moles.NH3_aq;
      stepSeconds(sim, 12.0, 0.05);

      assert(
        'v2 Arrhenius 4-class kinetics: Group 1 gentle, Group 2 diffusion-capped unless stirred, Group 3 locked at 25°C / unlocked at 82°C, Group 4 volatile NH3 loss',
        g1_348 / g1_298 < 1.6 &&
          g2_still85 < g2_unbounded85 * 0.4 &&
          g2_stir85 > g2_still85 * 2.5 &&
          g3_298 < 0.005 &&
          g3_355 / g3_298 > 200 &&
          (hotB.moles.NH3_aq || 0) < nh3Init * 0.90 &&
          (hotB.moles.NH3_aq || 0) < (coolB.moles.NH3_aq || 0),

      );
    }

    // TEST 48: Ammonia (NH3 25%) Buffer pH, [Cu(NH3)4]2+ & [Ag(NH3)2]+ Equilibria, and Adjacent HCl + NH3 White Smoke
    {
      // 1) Exact charge-balance pH solver for NH3/NH4+ buffer (~9.25) & NH4Cl (~4.6)
      const phBuffer = computePH({ H2O_l: 5.5, NH3_aq: 0.05, NH4_aq: 0.05 }, 0.1, 298.15);
      const phNH4Salt = computePH({ H2O_l: 5.5, NH4_aq: 0.10, Cl_aq: 0.10 }, 0.1, 298.15);

      // 2) CuSO4 -> deep royal violet-blue [Cu(NH3)4]2+, destroyed back to Cu2+ by HCl
      const simCu = new LabSimulation();
      const bCu = simCu.createApparatus('beaker_250', 220, 429);
      simCu.addReagentToVessel(bCu.id, 'h2o', 40);
      simCu.addReagentToVessel(bCu.id, 'cuso4_5h2o', 2.5); // ~10 mmol CuSO4
      stepSeconds(simCu, 4.0, 0.05);
      simCu.addReagentToVessel(bCu.id, 'nh3_25', 15); // ~200 mmol NH3
      stepSeconds(simCu, 4.0, 0.05);
      const cuAmmMol = bCu.moles.CuNH3_4_2_aq || 0;
      const cuVis = computeSolutionVisuals(bCu.moles, 0.055, bCu.tempK);
      simCu.addReagentToVessel(bCu.id, 'hcl_37', 30); // excess acid destroys ammine complex
      stepSeconds(simCu, 3.0, 0.05);
      const cuAmmAfterHCl = bCu.moles.CuNH3_4_2_aq || 0;

      // 3) AgCl dissolves in excess NH3 to [Ag(NH3)2]+ and re-precipitates upon HCl addition
      const simAg = new LabSimulation();
      const bAg = simAg.createApparatus('beaker_250', 220, 429);
      simAg.addReagentToVessel(bAg.id, 'h2o', 30);
      simAg.addReagentToVessel(bAg.id, 'agno3', 1.7); // 10 mmol AgNO3
      stepSeconds(simAg, 3.0, 0.05);
      simAg.addReagentToVessel(bAg.id, 'hcl_37', 1.2); // ~14.5 mmol HCl -> AgCl(s) + Cl-
      stepSeconds(simAg, 2.0, 0.05);
      simAg.addReagentToVessel(bAg.id, 'nh3_25', 15);
      stepSeconds(simAg, 4.0, 0.05);
      const agAmmMol = bAg.moles.AgNH3_2_aq || 0;
      const agClLeft = bAg.moles.AgCl_s || 0;
      simAg.addReagentToVessel(bAg.id, 'hcl_37', 25);
      stepSeconds(simAg, 2.0, 0.05);
      const agClReppt = bAg.moles.AgCl_s || 0;

      // 4) Adjacent open HCl 37% + NH3 25% vessels emit NH4Cl white smoke
      const simSmoke = new LabSimulation();
      const bHCl = simSmoke.createApparatus('beaker_250', 220, 429);
      const bNH3 = simSmoke.createApparatus('beaker_250', 340, 429);
      simSmoke.addReagentToVessel(bHCl.id, 'hcl_37', 20);
      simSmoke.addReagentToVessel(bNH3.id, 'nh3_25', 20);
      stepSeconds(simSmoke, 0.5, 0.05);

      assert(
        'Ammonia 25% chemistry: NH3/NH4+ buffer pH~9.25, deep violet-blue [Cu(NH3)4]2+ & acid reset, AgCl/NH3/[Ag(NH3)2]+ cycle, adjacent HCl+NH3 smoke',
        Math.abs(phBuffer - 9.25) < 0.08 &&
          phNH4Salt > 4.2 &&
          phNH4Salt < 5.0 &&
          cuAmmMol > 0.008 &&
          cuVis.css &&
          cuAmmAfterHCl < 1e-4 &&
          agAmmMol > 0.008 &&
          agClLeft < 5e-4 &&
          agClReppt > 0.008 &&
          simSmoke.lastWhiteSmokePairs.length >= 1,
        `pH(buf=${phBuffer.toFixed(2)}, NH4Cl=${phNH4Salt.toFixed(2)}), CuAmm=${(cuAmmMol*1000).toFixed(1)}->${(cuAmmAfterHCl*1000).toFixed(2)}mmol, AgAmm=${(agAmmMol*1000).toFixed(1)}/reppt=${(agClReppt*1000).toFixed(1)}mmol, smokePairs=${simSmoke.lastWhiteSmokePairs.length}`
      );
    }

    // TEST 49: Hydrogen Peroxide (H2O2 30%) Catalysis (Cu2+ / Ag), Noble Metal Oxidation (Cu, Ag), & Alkaline Phen Bleaching
    {
      // 1) Pure H2O2 shelf-stable vs Cu2+ & Ag(s) catalyzed O2 evolution + exothermic heating

      simOx.addReagentToVessel(bAgOx.id, 'hcl_37', 10);
      simOx.addReagentToVessel(bAgOx.id, 'h2o2_30', 10);

      // 3) Irreversible alkaline peroxide bleaching of Phenolphthalein

      assert(

          (bCu.escapedGasMoles.O2_g || 0) > 0.02 &&
          bCu.tempK > 305 &&
          (bAg.escapedGasMoles.O2_g || 0) > 0.01 &&
          (bCuOx.moles.Cu2_aq || 0) + (bCuOx.moles.CuCl4_2_aq || 0) > 0.005 &&
          (bAgOx.moles.AgCl_s || 0) > 0.002 &&
          (bBl.phenIrrevFrac || 0) > 0.5,
        `pureLeft=${(((bPure.moles.H2O2_aq||0)/pureStart)*100).toFixed(1)}%, O2_Cu=${((bCu.escapedGasMoles.O2_g||0)*1000).toFixed(1)}mmol(${(bCu.tempK-273.15).toFixed(1)}°C), O2_Ag=${((bAg.escapedGasMoles.O2_g||0)*1000).toFixed(1)}mmol, CuDiss=${(((bCuOx.moles.Cu2_aq||0)+(bCuOx.moles.CuCl4_2_aq||0))*1000).toFixed(1)}mmol, AgCl=${((bAgOx.moles.AgCl_s||0)*1000).toFixed(1)}mmol, phenBleach=${(bBl.phenIrrevFrac||0).toFixed(2)}`
      );

    // TEST 50: v2 Starter Shelf Parity, Dynamic nonVolatileSoluteMoles, & Dry Boundary on Ammonia/Peroxide Systems
    {

    // TEST 51: Cryoscopy (0.1 m CuSO4 ~ -0.26°C), Eutectic Ethanol/HCl37 Staying Liquid at -33°C, Ice 9% Expansion & Frozen Ion Preservation
    {
      const tfCu = solutionFreezingPointK({ H2O_l: 55.508, Cu2_aq: 0.1, SO4_2_aq: 0.1 });
      const tfNaCl = solutionFreezingPointK({ H2O_l: 55.508, Na_aq: 0.1, Cl_aq: 0.1 });
      const sim = new LabSimulation();
      sim.setAmbientTempK(240.15); // -33°C
      sim.environment.speed = 4;

      const bCu = sim.createApparatus('beaker_250', 180, 429);
      bCu.moles = { H2O_l: 5.5508, Cu2_aq: 0.01, SO4_2_aq: 0.01 }; // ~100 mL 0.1 M CuSO4
      const initLiqMl = computeLiquidVolumeL(bCu.moles, 298.15) * 1000;

      const bPhen = sim.createApparatus('beaker_250', 340, 429);
      sim.addReagentToVessel(bPhen.id, 'phen', 25);

      const bHCl = sim.createApparatus('beaker_250', 500, 429);
      sim.addReagentToVessel(bHCl.id, 'hcl_37', 25);

      let plateauSampleK = null;
      for (let i = 0; i < 650; i++) {
        sim.step(0.025);
        if (plateauSampleK === null && (bCu.moles.H2O_s || 0) > 1.0 && (bCu.moles.H2O_l || 0) > 1.0) {
          plateauSampleK = bCu.tempK;
        }
      }
      const iceMl = computeSolidVolumeMl(bCu.moles);
      const expansionRatio = iceMl / Math.max(1, initLiqMl);
      const phenLiqMl = computeLiquidVolumeL(bPhen.moles, bPhen.tempK) * 1000;
      const hclLiqMl = computeLiquidVolumeL(bHCl.moles, bHCl.tempK) * 1000;

      assert(
        'Cryoscopy & phase lock: 0.1 m CuSO4 Tf~-0.26°C, dil CuSO4 freezes solidly at -33°C (~9% expansion + trapped ions intact), Phen/HCl37 remain liquid',
        Math.abs((tfCu - 273.15) - (-0.26)) < 0.03 &&
          Math.abs((tfNaCl - 273.15) - (-0.37)) < 0.03 &&
          plateauSampleK !== null &&
          Math.abs(plateauSampleK - 273.15) < 1.2 &&
          bCu.isFrozenSolid === true &&
          (bCu.moles.H2O_s || 0) > 5.4 &&
          (bCu.moles.H2O_l || 0) < 1e-6 &&
          (bCu.moles.Cu2_aq || 0) > 0.0099 &&
          expansionRatio > 1.07 &&
          expansionRatio < 1.11 &&
          phenLiqMl > 20 &&
          (bPhen.moles.H2O_s || 0) < 1e-4 &&
          hclLiqMl > 18 &&
          (bHCl.moles.H2O_s || 0) < 1e-4,
        `tfCu=${(tfCu-273.15).toFixed(2)}°C, plateau=${plateauSampleK ? (plateauSampleK-273.15).toFixed(2) : 'n/a'}°C, exp=${expansionRatio.toFixed(3)}, Cu_s_frozen=${bCu.isFrozenSolid}, Cu2+=${(bCu.moles.Cu2_aq||0).toFixed(4)}, phenLiq=${phenLiqMl.toFixed(1)}mL, hclLiq=${hclLiqMl.toFixed(1)}mL`
      );
    }

    // TEST 52: Kinetic Locking (Zn + HCl & CuSO4·5H2O Dissolution in Ice) vs Exothermic Na on Ice Melt Film
    {
      const sim = new LabSimulation();
      sim.setAmbientTempK(240.15); // -33°C
      sim.environment.speed = 1;

      const bZn = sim.createApparatus('beaker_250', 180, 300);
      bZn.moles = { H2O_s: 5.55, H_aq: 0.2, Cl_aq: 0.2, Zn_s: 0.05 };
      bZn.tempK = 240.15;
      bZn.isFrozenSolid = true;

      const bDiss = sim.createApparatus('beaker_250', 340, 300);
      bDiss.moles = { H2O_s: 5.55, CuSO4_5H2O_s: 0.02 };
      bDiss.tempK = 240.15;
      bDiss.isFrozenSolid = true;

      const bNaIce = sim.createApparatus('beaker_250', 500, 300);
      bNaIce.moles = { H2O_s: 5.55, Na_s: 0.045 };
      bNaIce.tempK = 240.15;
      bNaIce.naTempK = 240.15;
      bNaIce.isFrozenSolid = true;

      stepSeconds(sim, 2.0, 0.02);
      const earlyH2 = (bNaIce.escapedGasMoles.H2_g || 0) + (bNaIce.moles.NaOH_aq || 0) * 0;
      const earlyNaRate = bNaIce.lastGasRateMap?.H2_g || 0;

      stepSeconds(sim, 10.0, 0.02);
      const lateH2 = bNaIce.escapedGasMoles.H2_g || 0;
      const lateNaRate = bNaIce.lastGasRateMap?.H2_g || 0;

      assert(
        'Kinetic freeze vs Na-ice: Zn+HCl & CuSO4·5H2O remain locked at 0 in ice; Na on -33°C ice starts slow then accelerates via exothermic melt film',
        (bZn.moles.Zn_s || 0) > 0.04999 &&
          (bZn.escapedGasMoles.H2_g || 0) === 0 &&
          (bDiss.moles.Cu2_aq || 0) === 0 &&
          lateH2 > 0.005 &&
          lateH2 > earlyH2 * 4 &&
          (lateNaRate > earlyNaRate || bNaIce.naTempK > 273.15),
        `ZnLeft=${(bZn.moles.Zn_s||0).toFixed(5)}, CuDiss=${(bDiss.moles.Cu2_aq||0).toFixed(5)}, H2_early=${(earlyH2*1000).toFixed(2)}mmol, H2_late=${(lateH2*1000).toFixed(2)}mmol, TNa=${bNaIce.naTempK.toFixed(1)}K`
      );
    }

    // TEST 53: Cold Cryo-Crystallization of Cooling Salt & Burner Latent-Heat Melting Plateau
    {
      const sim = new LabSimulation();
      sim.setAmbientTempK(274.2); // +1.05°C cold liquid, just above freezing
      sim.environment.speed = 4;

      const bCryst = sim.createApparatus('beaker_250', 220, 300);
      // 0.095 mol CuSO4 in 36 g H2O (~2.64 mol/kg) — soluble at 45°C, supersaturated at 1°C (~0.93 mol/kg)!
      bCryst.moles = { H2O_l: 2.0, Cu2_aq: 0.095, SO4_2_aq: 0.095 };
      bCryst.tempK = 318.15;

      );
    }

    // TEST 54: 3 Cryo Bugfixes (No Subzero Mist / HCl Fume + Frost Rime, Syringe Charles Contraction & Ice Condensation, Escaped H2O(g) -> Frost)
    {
      const mistNeg43 = computeSteamOpacity(230.15, 240.15, 0.60);
      const mistNeg33 = computeSteamOpacity(240.15, 240.15, 0.60);
      const mistThresh = computeSteamOpacity(255.15, 240.15, 0.60);

      const sim = new LabSimulation();
      sim.setAmbientTempK(240.15);
      const bFrost = sim.createApparatus('beaker_250', 180, 300);
      bFrost.moles = { H2O_s: 5.55 };
      bFrost.tempK = 240.15;

      sim.condenseEscapedVaporInCryo();

      const bColdHCl = sim.createApparatus('beaker_250', 320, 300);
      sim.addReagentToVessel(bColdHCl.id, 'hcl_37', 25);
      bColdHCl.tempK = 240.15;

      // Gas Syringe Charles's Law contraction: 298.15 K -> 240.15 K (~19.45%) + steam freezing inside syringe
      const simSyr = new LabSimulation();
      simSyr.setAmbientTempK(298.15);
      const syr = simSyr.createApparatus('gas_syringe', 450, 260);
      syr.gasMoles.H2_g = 0.004;
      syr.tempK = 298.15;
      const v298 = computeSyringeGasVolumeMl(syr, simSyr.environment);

      simSyr.setAmbientTempK(240.15);
      stepSeconds(simSyr, 15.0, 0.025);
      const v240 = computeSyringeGasVolumeMl(syr, simSyr.environment);
      const charlesRatio = v240 / v298;

      const syrSteam = simSyr.createApparatus('gas_syringe', 560, 260);
      syrSteam.gasMoles.H2O_g = 0.003;
      syrSteam.gasMoles.H2_g = 0.002;
      syrSteam.tempK = 360;
      stepSeconds(simSyr, 12.0, 0.025);

      sim.step(0.05);
      sim.step(0.05);

      const ps = new ParticleSystem();
      ps.emitForVessel(
        bColdHCl,
        {
          gasRates: { HCl_g: 0, H2_g: 0, O2_g: 0, Cl2_g: 0, NH3_g: 0, NO2_g: 0, NO_g: 0, C2H5Cl_g: 0, C2H5OH_g: 0 },
          steamRate: 0,
          steamOpacity: 0,
          overflowRateMlS: 0,
          isBoiling: false,
        },
        0.5
      );

      assert(
        '3 Cryo fixes: 0 subzero mist/HCl fog, frostOpacity > 0.3, Charles ~19.5% syringe contraction, steam->ice inside syringe, escaped H2O(g)->frost',
        mistNeg43 === 0 &&
          mistNeg33 === 0 &&
          mistThresh === 0 &&
          ps.particles.length === 0 &&
          bFrost.frostOpacity > 0.12 &&
          (bFrost.escapedGasMoles.H2O_g || 0) === 0 &&

          Math.abs(charlesRatio - 240.15 / 298.15) < 0.015 &&
          (syrSteam.frozenWaterMol || 0) > 0.002 &&
          (syrSteam.gasMoles.H2O_g || 0) < 1e-5,
        `mist=${mistNeg43}/${mistNeg33}/${mistThresh}, frostOp=${bFrost.frostOpacity.toFixed(2)}, escH2O=${bFrost.escapedGasMoles.H2O_g}, escFrost=${bFrost.escapedFrostH2OMol}, charles=${charlesRatio.toFixed(3)}, syrIce=${(syrSteam.frozenWaterMol||0).toFixed(4)}`
      );
    }

      sim.toggleVesselInverted(invTube.id);
      const genFlask = sim.createApparatus('erlenmeyer_250', 120, 399);
      genFlask.moles = { H2O_l: 2.0, H_aq: 0.2, Cl_aq: 0.2, Zn_s: 0.04 };
      sim.connectTube(genFlask.id, invTube.id);
      stepSeconds(sim, 3.0, 0.04);

      const simDist = new LabSimulation();
      const bnD = simDist.createApparatus('burner', 220, 426);
      simDist.setBurnerFlame(bnD.id, 3);
      const fBoil = simDist.createApparatus('erlenmeyer_250', 220, 310);
      fBoil.moles = { H2O_l: 1.5, C2H5OH_l: 0.5 };

      const cond = simDist.createApparatus('liebig_condenser', 380, 220);
      const stand = simDist.createApparatus('retort_stand', 380, 327);
      simDist.attachToStand(cond.id, stand.id);

      simDist.connectTube(fBoil.id, cond.id);
      stepSeconds(simDist, 32.0, 0.05);

      assert(
        'Group 2 tools: Porcelain dish survives Na flare, Splint O2-relight & H2-pop trigger, Flame Loop emits Na+ #facc15, Inverted tube collects H2 in trough, Liebig Condenser distills EtOH/H2O',

    // TEST 59: Group 3 Titration & Indicators (Burette 50 mL vertical drip + Litmus & Universal pH strips)
    {

      sim.setBuretteValveRate(bur.id, 0);

    // TEST 60: Group 4 Mechanics (Mortar & Pestle crushing increases Noyes-Whitney rate; Stir Bar sustains suspension vortex)
    {
      const sim = new LabSimulation();
      const mortar = sim.createApparatus('mortar_pestle', 180, 451);

      const afterCount = mortar.particleCounts.CuSO4_5H2O_s;

      const bFine = sim.createApparatus('beaker_250', 340, 427);
      bFine.moles = { H2O_l: 5.0 };
      sim.transferSolidsToVessel(mortar.id, bFine.id, 1.0);

      const bCoarse = sim.createApparatus('beaker_250', 480, 427);
      bCoarse.moles = { H2O_l: 5.0 };
      sim.addReagentToVessel(bCoarse.id, 'cuso4_5h2o', 2.5, { silentAnim: true, fine: false });

      // Measure initial dissolution velocity cleanly at t = 0.24s under identical unstirred conditions
      stepSeconds(sim, 0.24, 0.04);
      const cuFine = bFine.moles.Cu2_aq || 0;
      const cuCoarse = bCoarse.moles.Cu2_aq || 0;

      // Dock Magnetic Stir Bar and run continuous stirring over precipitated AgCl(s)
      const bar = sim.createApparatus('stir_bar', 480, 427);
      bar.inVesselId = bCoarse.id;
      bCoarse.hasStirBar = true;
      bCoarse.moles.AgCl_s = 0.01;

      sim.toggleMagneticStir(bCoarse.id, 800);

      stepSeconds(sim, 1.5, 0.04);

      assert(
        'Mortar crushing multiplies solid surface area (dissolving fine CuSO4 faster), and Magnetic Stir Bar keeps continuous suspension',
        afterCount > beforeCount * 10 &&
          cuFine > cuCoarse * 1.6 &&
          bCoarse.magStirRpm === 800 &&
          bCoarse.stirTimer > 0 &&
          (bCoarse.suspensionLevel || 0) > 0.5,
        `particles(${beforeCount}->${afterCount}), Cu_fine=${(cuFine*1000).toFixed(2)}mmol > coarse=${(cuCoarse*1000).toFixed(2)}mmol, susp=${(bCoarse.suspensionLevel||0).toFixed(2)}`
      );
    }

    // TEST 61: Group 5 Electrochemistry (Faraday CuSO4 Electrolysis + Daniell Zn-Cu 1.10 V Galvanic Cell with Salt Bridge)
    {
      // Part A: Electrolysis CuSO4 -> Cu(s) cathode + O2(g) anode + H2SO4 (acidic)
      const simEl = new LabSimulation();
      const bEl = simEl.createApparatus('beaker_250', 300, 427);
      bEl.moles = { H2O_l: 5.5, Cu2_aq: 0.05, SO4_2_aq: 0.05 };
      const eAn = simEl.createApparatus('electrode_rod', 280, 412);
      eAn.material = 'C';
      eAn.dockedVesselId = bEl.id;
      const eCa = simEl.createApparatus('electrode_rod', 320, 412);
      eCa.material = 'C';
      eCa.dockedVesselId = bEl.id;
      const dcEl = simEl.createApparatus('dc_power', 500, 441);
      dcEl.posElectrodeId = eAn.id;
      dcEl.negElectrodeId = eCa.id;
      simEl.setDcPowerState(dcEl.id, { voltageV: 6.0, powerOn: true });

      stepSeconds(simEl, 25.0, 0.05);
      const cuPlated = bEl.moles.Cu_s || 0;
      const o2Evolved = bEl.escapedGasMoles.O2_g || 0;
      const hProduced = bEl.moles.H_aq || 0;

      // Part B: Daniell Cell Zn | ZnSO4 || CuSO4 | Cu -> ~1.10 V EMF + spontaneous discharge
      const simGal = new LabSimulation();
      const bZn = simGal.createApparatus('beaker_250', 220, 427);
      bZn.moles = { H2O_l: 5.5, Zn2_aq: 0.1, SO4_2_aq: 0.1 };
      const bCu = simGal.createApparatus('beaker_250', 320, 427);
      bCu.moles = { H2O_l: 5.5, Cu2_aq: 0.1, SO4_2_aq: 0.1 };
      const sb = simGal.createApparatus('salt_bridge', 270, 390);
      const elZn = simGal.createApparatus('electrode_rod', 210, 412);
      elZn.material = 'Zn';
      elZn.dockedVesselId = bZn.id;
      const elCu = simGal.createApparatus('electrode_rod', 330, 412);
      elCu.material = 'Cu';
      elCu.dockedVesselId = bCu.id;
      const dcGal = simGal.createApparatus('dc_power', 500, 441);
      dcGal.posElectrodeId = elZn.id;
      dcGal.negElectrodeId = elCu.id;
      simGal.setDcPowerState(dcGal.id, { voltageV: 0, powerOn: false });
      simGal.step(0.05);
      const openEmfV = dcGal.measuredV;

      simGal.setDcPowerState(dcGal.id, { powerOn: true });
      stepSeconds(simGal, 45.0, 0.05);

      assert(
        'Electrochemistry: Faraday CuSO4 electrolysis plates Cu(s) + O2(g) + H+, and Daniell Zn–Cu cell measures ~1.10 V EMF across Salt Bridge & discharges spontaneously',
        dcEl.measuredCurrentA > 0.4 &&
          cuPlated > 1e-4 &&
          o2Evolved > 5e-5 &&
          hProduced > 2e-4 &&
          Math.abs(openEmfV - 1.10) < 0.04 &&
          dcGal.circuitMode === 'galvanic' &&
          dcGal.measuredCurrentA > 0.3 &&
          (bCu.moles.Cu_s || 0) > 1e-4 &&
          bZn.moles.Zn2_aq > 0.1001,
        `I_el=${(dcEl.measuredCurrentA||0).toFixed(2)}A, Cu=${(cuPlated*1000).toFixed(3)}mmol, O2=${(o2Evolved*1000).toFixed(3)}mmol, EMF=${openEmfV.toFixed(3)}V, Cu_gal=${((bCu.moles.Cu_s||0)*1000).toFixed(3)}mmol`
      );
    }

    // TEST 63: Ethanol & Aq-Ethanol vapor collection in Gas Syringe + Gas-phase NH3 + HCl -> NH4Cl(s) in Syringe
    {
      // Part A: Pure Ethanol vapor collects cleanly into Gas Syringe (condensate + vapor) & re-evaporates >= 78.3C
      const simEt = new LabSimulation();
      const bnEt = simEt.createApparatus('burner', 220, 428);
      simEt.setBurnerFlame(bnEt.id, 3);
      const flEt = simEt.createApparatus('erlenmeyer_250', 220, 310);
      flEt.moles = { C2H5OH_l: 0.45 };
      const syrEt = simEt.createApparatus('gas_syringe', 480, 320);
      simEt.connectSyringe(flEt.id, syrEt.id);
      simEt.updateSupportAttachments();
      stepSeconds(simEt, 16.0, 0.05);
      const condEt = syrEt.condensedEtOHMol || 0;
      const gasEt = syrEt.gasMoles.C2H5OH_g || 0;

      // Part B: Aqueous Ethanol (Phen 1%) collects both C2H5OH and H2O into Gas Syringe
      const simAq = new LabSimulation();
      const bnAq = simAq.createApparatus('burner', 220, 428);
      simAq.setBurnerFlame(bnAq.id, 3);
      const flAq = simAq.createApparatus('erlenmeyer_250', 220, 310);
      simAq.addReagentToVessel(flAq.id, 'phen', 25);
      const syrAq = simAq.createApparatus('gas_syringe', 480, 320);
      simAq.connectSyringe(flAq.id, syrAq.id);
      simAq.updateSupportAttachments();
      stepSeconds(simAq, 18.0, 0.05);
      const colAqEt = (syrAq.condensedEtOHMol || 0) + (syrAq.gasMoles.C2H5OH_g || 0);
      const colAqH2O = (syrAq.condensedWaterMol || 0) + (syrAq.gasMoles.H2O_g || 0);

      // Part C: Leading NH3(g) into Gas Syringe pre-filled with HCl(g) -> stoichiometric NH4Cl(s) contraction
      const simSal = new LabSimulation();
      const flNH3 = simSal.createApparatus('erlenmeyer_250', 220, 399);
      simSal.addReagentToVessel(flNH3.id, 'nh3_25', 20);
      flNH3.tempK = 338.0;
      const syrSal = simSal.createApparatus('gas_syringe', 480, 400);
      syrSal.gasMoles.HCl_g = 0.008; // ~198 mL HCl(g)
      const hclBefore = syrSal.gasMoles.HCl_g;
      simSal.connectSyringe(flNH3.id, syrSal.id);
      stepSeconds(simSal, 12.0, 0.05);
      const nh4clFormed = (syrSal.overflowMoles?.NH4Cl_s || 0) + (syrSal.overflowMoles?.NH4_aq || 0);
      const hclAfter = syrSal.gasMoles.HCl_g || 0;

      assert(
        'Ethanol & Aq-Ethanol vapor collect cleanly in Gas Syringe, and NH3(g) + HCl(g) react inside syringe barrel to form NH4Cl(s)',
        condEt + gasEt > 0.02 &&
          colAqEt > 0.01 &&
          colAqH2O > 0.005 &&
          nh4clFormed > 0.0005 &&
          hclAfter < hclBefore - 0.0004,
        `pureEt=${((condEt+gasEt)*1000).toFixed(1)}mmol, aqEt=${(colAqEt*1000).toFixed(1)}mmol, aqH2O=${(colAqH2O*1000).toFixed(1)}mmol, NH4Cl=${(nh4clFormed*1000).toFixed(2)}mmol`
      );
    }

      const bar = simStir.createApparatus('stir_bar', 400, 470);
      const insOk = simStir.insertStirBarIntoVessel(bar.id, bk.id, 800);
      const rpmOn = bk.magStirRpm;
      simStir.removeStirBarFromVessel(bar.id);

      assert(
        'Fragility rules reversed: Porcelain Dish & Mortar survive 360px drop while Burette/Condenser/SaltBridge/Funnel break; Stir Bar auto-spins & removes cleanly',
        !dish.isShattered &&
          !mortar.isShattered &&
          bur.isBroken &&
          cond.isBroken &&
          sb.isBroken &&
          fun.isBroken &&
          insOk &&
          rpmOn === 800 &&
          !bk.hasStirBar &&
          bar.inVesselId === null,
        `dishBreak=${dish.isShattered}, mortarBreak=${mortar.isShattered}, glassBreak=${bur.isBroken&&cond.isBroken&&sb.isBroken&&fun.isBroken}, stirOn=${rpmOn}->${bk.magStirRpm}`
      );
    }

    // TEST 66: Condenser Dual-Port Outlet Tubing + O2 Splint Blazing Flare + Clean Flame Loop Ion Label
    {
      const sim = new LabSimulation();
      const bn = sim.createApparatus('burner', 200, 428);
      sim.setBurnerFlame(bn.id, 3);
      const fl = sim.createApparatus('erlenmeyer_250', 200, 310);
      fl.moles = { H2O_l: 2.0, C2H5OH_l: 0.6 };
      sim.updateSupportAttachments();
      const cond = sim.createApparatus('liebig_condenser', 360, 220);
      const stand = sim.createApparatus('retort_stand', 360, 327);
      sim.attachToStand(cond.id, stand.id);
      const rcvOffset = sim.createApparatus('beaker_250', 580, 427);
      sim.connectTube(fl.id, cond.id);
      sim.connectCondenserOutlet(cond.id, rcvOffset.id);
      stepSeconds(sim, 36.0, 0.05);

      const bO2 = sim.createApparatus('beaker_250', 760, 427);
      bO2.moles = { H2O_l: 1.5, H2O2_aq: 0.25, Cu2_aq: 0.05, SO4_2_aq: 0.05 };
      const burnSpl = sim.createApparatus('splint', 810, 372);
      burnSpl.mode = 'burning';
      burnSpl.isDragging = true;
      const bNa = sim.createApparatus('beaker_250', 900, 427);
      bNa.moles = { H2O_l: 1.0, Na_aq: 0.4, Cl_aq: 0.4 };
      const loop = sim.createApparatus('flame_loop', 950, 427);
      stepSeconds(sim, 0.25, 0.05);

      assert(
        'Condenser outlet port routes distillate to offset flask; Burning splint flares vividly in O2; Flame loop displays clean ion symbol',
        (rcvOffset.moles.C2H5OH_l || 0) > 0.01 &&
          burnSpl.lastTestEvent === 'o2_flare' &&
          (burnSpl.o2FlareTimer || 0) > 1.0 &&
          loop.sampleLabel === 'Na⁺',
        `distOffset=${((rcvOffset.moles.C2H5OH_l||0)*1000).toFixed(1)}mmol, splEvt=${burnSpl.lastTestEvent}, flareT=${(burnSpl.o2FlareTimer||0).toFixed(2)}, loopLbl=${loop.sampleLabel}`
      );
    }

    // TEST 67: Mounted Funnel Aim Priority + Litmus hides pH + Burette Clamp Snap + Electrode Material Switching
    {
      const sim = new LabSimulation();
      const ps = new ParticleSystem();
      const wrap = document.createElement('div');
      wrap.style.width = '1000px';
      wrap.style.height = '560px';
      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      document.body.appendChild(wrap);
      const wb = new LabWorkbenchCanvas(canvas, sim, ps, {});
      wb.resize();

      const recv = sim.createApparatus('beaker_250', 320, 427);
      const funnel = sim.createApparatus('filter_funnel', 320, 354);
      funnel.mountedOnVesselId = recv.id;
      const aimed = wb.findVesselAt(320, 410, null, true);

      const stand = sim.createApparatus('retort_stand', 500, 327);
      const bur = sim.createApparatus('burette_50', 515, 220);
      const nearStand = wb.findStandNear(bur);

      const insEl = document.createElement('div');
      const ins = new InspectorPanel(insEl, sim, () => (k) => I18N.vi[k] || k, {});
      const lit = sim.createApparatus('litmus_paper', 600, 460);
      lit.sampledPH = 1.5;
      lit.sampledFrom = '#1';
      lit.tipColor = '#ef4444';
      sim.selectedId = lit.id;
      ins.update('vi', true);
      const litText = insEl.textContent;

      const phs = sim.createApparatus('ph_strip', 700, 460);
      phs.sampledPH = 2.4;
      phs.sampledFrom = '#1';
      phs.tipColor = '#f97316';
      sim.selectedId = phs.id;
      ins.update('vi', true);
      const phsText = insEl.textContent;

      const el = sim.createApparatus('electrode_rod', 320, 412);
      el.dockedVesselId = recv.id;
      const sigBefore = ins.getStructureSignature((k) => I18N.vi[k] || k, 'vi');
      sim.selectedId = el.id;
      ins.update('vi', true);
      const cuBtn = insEl.querySelector('.el-mat-btn[data-mat="Cu"]');
      cuBtn?.click();
      const elHit = wb.hitTestItem(el.x, el.y);
      const sigAfter = ins.getStructureSignature((k) => I18N.vi[k] || k, 'vi');

      wrap.remove();

      assert(
        'Mounted funnel captures container aim, Litmus hides numeric pH (pH strip shows it), Burette snaps to stand, and Electrode material switches reliably',
        aimed?.id === funnel.id &&
          nearStand?.id === stand.id &&
          !litText.includes('1.5') &&
          litText.includes('Acid') &&
          phsText.includes('2.4') &&
          el.material === 'Cu' &&
          sigBefore !== sigAfter &&
          elHit?.id === el.id,
        `aim=${aimed?.id}, stand=${nearStand?.id}, lit=${litText.includes('1.5')}, phs=${phsText.includes('2.4')}, elMat=${el.material}, elHit=${elHit?.id}`
      );
    }

    // Render test report
    const passed = results.filter(r => r.pass).length;
    document.getElementById('summary').innerHTML = `<span class="${passed === results.length ? 'pass' : 'fail'}">${passed} / ${results.length} tests passed</span>`;
    document.getElementById('results').innerHTML = results.map(r =>
      `<li class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} — ${r.name} <span style="color:#94a3b8;font-weight:400">(${r.info})</span></li>`
    ).join('');
    document.getElementById('details').textContent = details.join('\n');
    window.__TEST_RESULTS__ = { total: results.length, passed, results };
  </script>
</body>
</html>
